# ==========================================
# 1. Spring Application Core
# ==========================================
spring.application.name=Sports_predict_live
spring.profiles.include=secret

# ==========================================
# 2. Server
# ==========================================
# Local
server.port=8080
# AWS
#server.port=9090

# ==========================================
# 3. Database & JPA
# ==========================================
# DataSource
# Local
spring.datasource.url=jdbc:mysql://localhost:3306/ai_match?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
# AWS
#spring.datasource.url=jdbc:mysql://sports-predict-live.c10w4u6cu8br.ap-northeast-2.rds.amazonaws.com:3306/ai_match?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&connectTimeout=10000&socketTimeout=60000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

# ==========================================
# 4. Mail (SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================================
# 5. Security & Authentication (JWT)
# ==========================================
jwt.access-expiration=1800000
jwt.refresh-expiration=604800000

# CORS 허용 오리진 (콤마 구분) — localhost 와 AWS 배포 도메인을 함께 등록
cors.allowed-origins=http://localhost:8080,http://localhost:3000,http://43.201.107.175:9090

# ==========================================
# 6. OAuth2 - Google
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# ==========================================
# 7. OAuth2 - Kakao
# ==========================================
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email,profile_image
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# ==========================================
# 8. AI API (OpenAI)
# ==========================================
openai.api-key=${OPENAI_API_KEY}

# ==========================================
# 9. External API Keys
# ==========================================
naver.client-id=${NAVER_CLIENT_ID}
naver.client-secret=${NAVER_CLIENT_SECRET}
lol.api-key=${LOL_API_KEY}

# ==========================================
# 10. File Upload
# ==========================================
# Local
com.example.upload.path=C:/board/uploads/
# AWS
#com.example.upload.path=/home/ubuntu/uploads/
#spring.servlet.multipart.location=/tmp
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=55MB