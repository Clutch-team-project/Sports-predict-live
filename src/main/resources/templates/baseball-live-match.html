<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI.MATCH - 야구 경기 중계</title>

    <style>
        /* =========================================================
           01. Design Tokens / Reset
        ========================================================= */
        :root {
            --page-bg: #cbd5e1;
            --card: #ffffff;
            --soft: #f8fafc;
            --line: #d5deea;
            --line-soft: #e2e8f0;
            --text: #13223a;
            --muted: #64748b;
            --blue: #2563eb;
            --red: #ef4444;
            --orange: #ff9b45;
            --shadow: 0 8px 22px rgba(15, 23, 42, .12);
            --radius: 16px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background-color: var(--page-bg);
            background-image:
                    linear-gradient(rgba(148,163,184,.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(148,163,184,.1) 1px, transparent 1px);
            background-size: 24px 24px;
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
            line-height: 1.35;
        }

        button,
        input { font-family: inherit; }

        button { cursor: pointer; }

        .hidden { display: none !important; }

        /* =========================================================
           02. Page Layout
        ========================================================= */
        .page {
            width: min(1180px, calc(100% - 48px));
            margin: 0 auto;
            padding: 14px 0 44px;
        }

        .layout {
            margin-top: 18px;
            display: grid;
            grid-template-columns: minmax(0, 820px) 320px;
            justify-content: center;
            gap: 14px;
            align-items: start;
        }

        .main-stack,
        .side-stack {
            display: grid;
            gap: 14px;
            min-width: 0;
        }

        .side-stack {
            position: sticky;
            top: 16px;
        }

        /* =========================================================
           03. Common Card / Panel
        ========================================================= */
        .scoreboard,
        .panel,
        .side-panel,
        .relay-card,
        .tabs {
            border: 1px solid var(--line);
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 15px;
            border-bottom: 1px solid var(--line-soft);
            background: var(--soft);
        }

        .panel-title {
            color: var(--text);
            font-size: 15px;
            font-weight: 950;
        }

        .panel-sub {
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .empty-state {
            min-height: 120px;
            display: grid;
            place-items: center;
            padding: 18px;
            border: 1px dashed #cbd5e1;
            border-radius: 14px;
            background: var(--soft);
            color: var(--muted);
            font-size: 13px;
            font-weight: 850;
            text-align: center;
            white-space: pre-line;
        }

        /* 예정 경기 탭 안내 메시지 */
        .scheduled-tab-panel {
            min-height: 270px;
            display: grid;
            place-items: center;
            padding: 28px;
            border: 1px solid var(--line);
            border-radius: 0 0 14px 14px;
            background: #ffffff;
        }

        .scheduled-tab-message {
            color: #6f7785;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.45;
            text-align: center;
            white-space: pre-line;
        }

        /* =========================================================
           04. Top Scoreboard
        ========================================================= */
        .scoreboard { background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%); }

        .score-head {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 18px;
            padding: 20px 24px 16px;
            border-bottom: 1px solid var(--line-soft);
            background: var(--soft);
        }

        .team {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
        }

        .team.away {
            justify-content: flex-end;
            text-align: right;
        }

        .team-logo {
            width: 64px;
            height: 64px;
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            border-radius: 18px;
            border: 1px solid #fed7aa;
            background: #fff1eb;
            color: #c2410c;
            font-size: 28px;
            font-weight: 950;
        }

        .team-logo.away {
            border-color: #bfdbfe;
            background: #eaf2ff;
            color: #1d4ed8;
        }

        .team-name {
            color: var(--text);
            font-size: 16px;
            font-weight: 950;
        }

        .team-meta {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .score-core {
            min-width: 170px;
            text-align: center;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            padding: 5px 11px;
            border: 1px solid #ffc2c9;
            border-radius: 999px;
            background: #ffe8eb;
            color: #c91f34;
            font-size: 12px;
            font-weight: 950;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--red);
            box-shadow: 0 0 0 5px rgba(239, 68, 68, .14);
        }

        .score-number {
            color: var(--text);
            font-size: 38px;
            font-weight: 950;
            letter-spacing: 6px;
        }

        .score-caption {
            margin-top: 5px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .inning-board {
            padding: 10px 16px 14px;
            overflow-x: auto;
            background: #ffffff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        .inning-board th,
        .inning-board td {
            padding: 6px 8px;
            border-bottom: 1px solid var(--line-soft);
            color: #334155;
            text-align: center;
            font-size: 12px;
            white-space: nowrap;
        }

        .inning-board th:first-child,
        .inning-board td:first-child {
            color: var(--text);
            text-align: left;
            font-weight: 950;
        }

        .inning-board .total {
            color: var(--blue);
            font-weight: 950;
        }

        .state-note {
            margin-top: 8px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        /* =========================================================
           05. Tabs
        ========================================================= */
        .tabs {
            display: flex;
            gap: 6px;
            padding: 8px;
        }

        .tab {
            flex: 1;
            height: 42px;
            border: 0;
            border-radius: 10px;
            background: transparent;
            color: var(--muted);
            font-weight: 950;
        }

        .tab.active {
            background: var(--blue);
            color: #ffffff;
        }

        /* =========================================================
           06. Relay / Stadium
        ========================================================= */
        .relay-card { background: #ffffff; }

        .relay-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            padding: 14px 17px;
            border-bottom: 1px solid var(--line-soft);
            background: var(--soft);
        }

        .refresh-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
        }

        .refresh-icon {
            width: 24px;
            height: 24px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: #ffffff;
            color: var(--blue);
        }

        .br-ground-wrap {
            padding: 14px;
            background: #ffffff;
        }

        .br-stadium {
            position: relative;
            width: 100%;
            overflow: hidden;
            border-radius: 18px;
            background: #bfe7ec;
            box-shadow:
                    inset 0 0 0 1px rgba(255,255,255,.45),
                    0 10px 24px rgba(18, 37, 66, .1);
            isolation: isolate;
        }

        .br-stadium-img {
            display: block;
            width: 100%;
            height: auto;
            border-radius: inherit;
            user-select: none;
            pointer-events: none;
        }

        .br-stadium::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            border-radius: inherit;
            background:
                    linear-gradient(to bottom, rgba(0,0,0,.02), transparent 38%, rgba(0,0,0,.08)),
                    radial-gradient(circle at 50% 78%, transparent 0 48%, rgba(0,0,0,.12) 100%);
        }
        /* =========================================================
           07. Stadium Score Board Overlay
           최종 정리본
           HTML 기준:
           .br-board
           ├─ .br-board-score-row
           │  ├─ .br-board-team
           │  ├─ .br-board-center
           │  └─ .br-board-team
           └─ .br-board-count-row
              └─ .br-count-strip
                 ├─ .br-count-group.br-count-b
                 ├─ .br-count-group.br-count-s
                 ├─ .br-count-group.br-count-o
                 └─ .br-pitcher-inline
        ========================================================= */

        .br-board {
            position: absolute;
            left: 50%;
            top: 18.2%;
            width: 38.5%;
            height: 21.5%;
            transform: translateX(-50%);
            z-index: 10;

            display: grid;
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 7px;

            padding: 13px 17px 11px;
            border-radius: 5px;
            border: 4px solid rgba(28, 49, 60, .98);

            background:
                    radial-gradient(circle at 50% 0%, rgba(120, 164, 184, .18), transparent 42%),
                    linear-gradient(180deg, #466b7f 0%, #3D5E70 42%, #2a4654 100%);

            color: #eef8ff;

            box-shadow:
                    inset 0 0 0 1px rgba(255,255,255,.08),
                    inset 0 -18px 28px rgba(0,0,0,.22),
                    0 12px 24px rgba(0,0,0,.24);
        }

        .br-board::before {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 3px;
            border: 1px solid rgba(195, 226, 236, .14);
            background:
                    linear-gradient(180deg, rgba(255,255,255,.045), transparent 38%),
                    repeating-linear-gradient(
                            0deg,
                            rgba(255,255,255,.025) 0,
                            rgba(255,255,255,.025) 1px,
                            transparent 1px,
                            transparent 5px
                    );
            pointer-events: none;
        }

        .br-board::after {
            content: "";
            position: absolute;
            left: 11px;
            right: 11px;
            top: 10px;
            height: 36%;
            border-radius: 3px;
            background: linear-gradient(180deg, rgba(255,255,255,.08), transparent);
            pointer-events: none;
        }

        /* ==============================
           점수 / 이닝 / 아웃
        ============================== */

        .br-board-score-row {
            position: relative;
            z-index: 2;

            display: grid;
            grid-template-columns: minmax(0, 1fr) 76px minmax(0, 1fr);
            align-items: center;
            gap: 12px;

            min-width: 0;
            padding: 0 2px;
        }

        .br-board-team {
            min-width: 0;
            display: grid;
            align-content: center;
            gap: 5px;
            text-align: center;
        }

        .br-board-team span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: #d9f4ff;
            font-size: clamp(13px, 1.55vw, 18px);
            line-height: 1;
            font-weight: 1000;
            letter-spacing: -.02em;

            text-shadow:
                    0 1px 5px rgba(0,0,0,.32),
                    0 0 8px rgba(125, 211, 252, .18);
        }

        .br-board-team strong {
            color: #ffffff;
            font-size: clamp(42px, 5.2vw, 66px);
            line-height: .82;
            font-weight: 1000;
            letter-spacing: -.08em;

            text-shadow:
                    0 3px 0 rgba(13, 33, 43, .7),
                    0 8px 14px rgba(0,0,0,.34),
                    0 0 18px rgba(255,255,255,.16);
        }

        /* 가운데 이닝 / 아웃 */
        .br-board-center {
            align-self: center;
            min-width: 0;

            display: grid;
            justify-items: center;
            gap: 6px;

            padding: 8px 6px;
            border-radius: 12px;

            background: rgba(15, 35, 45, .36);
            border: 1px solid rgba(199, 231, 242, .12);

            box-shadow:
                    inset 0 0 12px rgba(0,0,0,.18),
                    0 4px 10px rgba(0,0,0,.12);
        }

        .br-board-center em {
            color: #d7f3ff;
            font-size: clamp(10px, 1.05vw, 13px);
            line-height: 1;
            font-style: normal;
            font-weight: 1000;
            letter-spacing: -.02em;

            text-shadow: 0 2px 6px rgba(0,0,0,.28);
        }

        .br-board-center b {
            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-width: 48px;
            padding: 5px 8px;
            border-radius: 999px;

            background: linear-gradient(180deg, #ffd84d 0%, #f5b90b 100%);
            color: #263744;

            font-size: clamp(10px, 1.1vw, 13px);
            line-height: 1;
            font-weight: 1000;
            letter-spacing: -.02em;

            box-shadow:
                    inset 0 1px 0 rgba(255,255,255,.38),
                    0 3px 8px rgba(0,0,0,.26),
                    0 0 12px rgba(250, 204, 21, .24);
        }

        /* ==============================
           하단 볼카운트 / 투수
        ============================== */

        .br-board-count-row {
            position: relative;
            z-index: 2;

            display: flex;
            align-items: center;
            justify-content: center;

            min-width: 0;
        }

        .br-count-strip {
            width: 100%;
            min-width: 0;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            padding: 7px 12px;
            border-radius: 999px;

            background:
                    linear-gradient(180deg, rgba(22, 48, 61, .74), rgba(13, 32, 42, .82));

            border: 1px solid rgba(201, 231, 241, .08);

            box-shadow:
                    inset 0 1px 0 rgba(255,255,255,.05),
                    inset 0 -8px 14px rgba(0,0,0,.16),
                    0 4px 10px rgba(0,0,0,.12);

            white-space: nowrap;
        }

        /* B / S / O 그룹 */
        .br-count-group {
            flex: 0 0 auto;

            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .br-count-group span {
            color: #eaf6ff;
            font-size: clamp(8px, .9vw, 11px);
            line-height: 1;
            font-weight: 1000;
            letter-spacing: .02em;

            text-shadow: 0 2px 5px rgba(0,0,0,.36);
        }

        /* 기본 꺼진 점 */
        .br-count-dot {
            width: clamp(5px, .65vw, 8px);
            height: clamp(5px, .65vw, 8px);
            border-radius: 50%;

            background: rgba(217, 244, 255, .25);

            box-shadow:
                    inset 0 0 0 1px rgba(255,255,255,.08),
                    0 1px 3px rgba(0,0,0,.18);
        }

        /* 점등 색상 */
        .br-count-b .br-count-dot.on {
            background: #22c55e;
            box-shadow:
                    0 0 7px rgba(34,197,94,.62),
                    inset 0 0 0 1px rgba(255,255,255,.18);
        }

        .br-count-s .br-count-dot.on {
            background: #facc15;
            box-shadow:
                    0 0 7px rgba(250,204,21,.62),
                    inset 0 0 0 1px rgba(255,255,255,.18);
        }

        .br-count-o .br-count-dot.on {
            background: #fb7185;
            box-shadow:
                    0 0 7px rgba(251,113,133,.62),
                    inset 0 0 0 1px rgba(255,255,255,.18);
        }

        /* 투수 정보 */
        .br-pitcher-inline {
            min-width: 0;

            display: inline-flex;
            align-items: center;
            gap: 4px;

            margin-left: 4px;
            padding-left: 8px;

            border-left: 1px solid rgba(217, 244, 255, .16);
        }

        .br-pitcher-inline span {
            color: #cdefff;
            font-size: clamp(8px, .9vw, 11px);
            line-height: 1;
            font-weight: 950;
        }

        .br-pitcher-inline strong {
            max-width: 56px;

            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            color: #ffffff;
            font-size: clamp(9px, 1vw, 13px);
            line-height: 1;
            font-weight: 1000;
            letter-spacing: -.03em;

            text-shadow: 0 2px 6px rgba(0,0,0,.32);
        }

        .br-pitcher-inline em {
            color: #facc15;
            font-size: clamp(8px, .9vw, 11px);
            line-height: 1;
            font-style: normal;
            font-weight: 950;
        }

        .br-pitcher-inline em b {
            color: #facc15;
            font-size: clamp(10px, 1.1vw, 14px);
            font-weight: 1000;
        }

        /* ==============================
           전광판 반응형
        ============================== */

        @media (max-width: 720px) {
            .br-board {
                top: 18.6%;
                width: 42%;
                height: 22%;
                padding: 9px 10px 8px;
                gap: 4px;
                border-width: 3px;
            }

            .br-board-score-row {
                grid-template-columns: minmax(0, 1fr) 52px minmax(0, 1fr);
                gap: 7px;
            }

            .br-board-team span {
                font-size: 11px;
            }

            .br-board-team strong {
                font-size: 31px;
            }

            .br-board-center {
                padding: 6px 4px;
                gap: 5px;
            }

            .br-board-center em {
                font-size: 9px;
            }

            .br-board-center b {
                min-width: 40px;
                padding: 4px 6px;
                font-size: 9px;
            }

            .br-count-strip {
                gap: 6px;
                padding: 5px 8px;
            }

            .br-count-group {
                gap: 3px;
            }

            .br-pitcher-inline {
                gap: 3px;
                padding-left: 6px;
            }

            .br-pitcher-inline em {
                display: none;
            }
        }
        /* =========================================================
           08. Stadium Dynamic Overlays
        ========================================================= */
        .br-player,
        .br-runner {
            position: absolute;
            z-index: 12;
            transform: translate(-50%, -50%);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 950;
            white-space: nowrap;
            box-shadow: 0 6px 14px rgba(0,0,0,.18);
        }

        .br-player {
            background: rgba(7, 39, 24, .62);
            border: 1px solid rgba(255,255,255,.18);
            color: #ffffff;
        }

        .br-runner {
            z-index: 13;
            background: #ffffff;

            color: var(--text);
        }

        .br-pos-lf { left: 18.5%; top: 60%; }
        .br-pos-cf { left: 50%; top: 58%; }
        .br-pos-rf { left: 81.5%; top: 60%; }
        .br-pos-3b { left: 28%; top: 72%; }
        .br-pos-ss { left: 38%; top: 68%; }
        .br-pos-2b { left: 62%; top: 68%; }
        .br-pos-1b { left: 72%; top: 72%; }
        .br-pos-p { left: 50%; top: 73.5%; }
        .br-pos-c { left: 50%; top: 91.5%; }

        .br-runner-1 { left: 74%; top: 79%; }
        .br-runner-2 { left: 50%; top: 65%; }
        .br-runner-3 { left: 26%; top: 79%; }

        .br-ondeck {
            position: absolute;
            right: 18px;
            bottom: 18px;
            z-index: 14;
            min-width: 126px;
            padding: 12px 14px;
            border-radius: 14px;
            background: rgba(255,255,255,.95);
            color: var(--text);
            box-shadow: 0 10px 22px rgba(18,37,66,.18);
        }

        .br-ondeck-title {
            margin-bottom: 7px;
            color: var(--blue);
            font-size: 12px;
            font-weight: 950;
        }

        .br-ondeck ul {
            display: grid;
            gap: 4px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .br-ondeck li {
            color: var(--text);
            font-size: 13px;
            font-weight: 950;
        }

        .br-ondeck li span {
            margin-right: 4px;
            color: var(--muted);
        }

        /* =========================================================
           09. Timeline
        ========================================================= */
        .br-timeline-panel {
            border-top: 1px solid #d8e0ec;
            background: #ffffff;
        }

        .br-inning-tabs {
            display: grid;
            grid-template-columns: 72px repeat(9, minmax(56px, 1fr));
            gap: 6px;
            padding: 13px 18px;
            border-bottom: 1px solid #e1e7f0;
            background: #ffffff;
            overflow-x: auto;
        }

        .br-inning-tabs button {
            min-width: 54px;
            height: 36px;
            border: 1px solid transparent;
            border-radius: 999px;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 850;
            white-space: nowrap;
        }

        .br-inning-tabs button.active {
            background: var(--blue);
            color: #ffffff;
            box-shadow: 0 8px 14px rgba(59,130,246,.2);
        }

        .br-timeline-body {
            padding: 18px;
            background: #ffffff;
        }

        .timeline-list {
            display: grid;
            gap: 10px;
        }

        .timeline-event {
            display: grid;
            grid-template-columns: 92px 96px 1fr;
            gap: 10px;
            align-items: start;
            padding: 10px 12px;
            border: 1px solid var(--line-soft);
            border-radius: 12px;
            background: var(--soft);
            color: var(--text);
            font-size: 13px;
        }

        .timeline-event b { color: var(--blue); }
        .timeline-event em {
            color: var(--muted);
            font-style: normal;
            font-weight: 900;
        }

        .period-block {
            display: grid;
            gap: 12px;
            margin-bottom: 16px;
        }

        .period-block + .period-block {
            padding-top: 16px;
            border-top: 2px solid var(--line);
        }

        .period-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px;
            color: var(--text);
            font-size: 14px;
            font-weight: 950;
        }

        .period-title span {
            color: var(--muted);
            font-size: 12px;
            font-weight: 850;
        }

        .period-chip {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 12px;
            border: 1px solid #bfdbfe;
            border-radius: 999px;
            background: #eff6ff;
            color: var(--blue);
            font-size: 13px;
            font-weight: 950;
        }

        .atbat-card {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #ffffff;
            overflow: hidden;
        }

        .atbat-card.current {
            border-color: #93c5fd;
            box-shadow: inset 4px 0 0 var(--blue);
        }

        .atbat-head {
            display: grid;
            grid-template-columns: 58px 1fr auto;
            gap: 12px;
            align-items: center;
            padding: 14px;
            background: #f8fbff;
            border-bottom: 1px solid var(--line-soft);
        }

        .atbat-avatar {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #ffffff;
            color: var(--text);
            font-weight: 950;
            font-size: 18px;
        }

        .atbat-name {
            color: var(--text);
            font-size: 18px;
            font-weight: 950;
        }

        .atbat-name span,
        .atbat-meta {
            color: var(--muted);
            font-size: 12px;
            font-weight: 850;
        }

        .atbat-toggle,
        .atbat-badge {
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #ffffff;
            color: var(--text);
            padding: 9px 13px;
            font-size: 12px;
            font-weight: 950;
            white-space: nowrap;
        }

        .atbat-badge {
            border-color: #fecdd3;
            background: #fff1f2;
            color: #e11d48;
        }

        .current-stat-row {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 7px;
            padding: 12px 14px;
            background: #eff6ff;
            border-bottom: 1px solid var(--line);
        }

        .current-stat-row span {
            min-height: 50px;
            display: grid;
            place-items: center;
            gap: 2px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: #ffffff;
            color: var(--text);
            font-size: 13px;
            font-weight: 950;
        }

        .current-stat-row b {
            color: var(--muted);
            font-size: 11px;
        }

        .atbat-detail {
            display: grid;
            gap: 11px;
            padding: 12px 14px 14px;
        }

        .atbat-card.collapsed .atbat-detail,
        .atbat-card.collapsed .current-stat-row {
            display: none;
        }



        .pitch-list {
            display: grid;
            gap: 8px;
        }

        .pitch-row {
            display: grid;
            grid-template-columns: 42px 1fr auto;
            gap: 10px;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #ffffff;
            color: var(--text);
            font-size: 13px;
            font-weight: 900;
        }

        .pitch-row.result {
            border-color: #8bb8ff;
            background: #eaf2ff;
        }

        .pitch-number {
            width: 30px;
            height: 30px;
            display: grid;
            place-items: center;
            border-radius: 999px;
            background: #5b8cff;
            color: #ffffff;
            font-weight: 950;
        }

        .pitch-row.ball .pitch-number { background: #38d181; color: #052e18; }
        .pitch-row.foul .pitch-number { background: #ffb044; color: #422006; }

        .pitch-main b,
        .pitch-main span {
            display: block;
        }

        .pitch-main span {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 850;
        }

        .pitch-count {
            color: var(--text);
            font-size: 12px;
            font-weight: 950;
            white-space: nowrap;
        }

        .major-event-list {
            display: grid;
            gap: 6px;
            padding-top: 2px;
            color: var(--muted);
            font-size: 13px;
            font-weight: 850;
        }

        .major-event-list b {
            color: var(--text);
        }

        .pitch-event-row {
            padding: 9px 12px;
            border-top: 1px solid var(--line-soft);
            border-bottom: 1px solid var(--line-soft);
            color: var(--muted);
            font-size: 13px;
            font-weight: 850;
        }

        .pitch-event-row b {
            color: var(--text);
        }

        .pitcher-state-card {
            display: grid;
            grid-template-columns: 46px 1fr;
            gap: 10px;
            align-items: center;
            padding: 12px;
            border: 1px solid #fed7aa;
            border-left: 3px solid var(--orange);
            border-radius: 12px;
            background: #fff7ed;
            color: var(--text);
        }

        .pitcher-state-card .pitcher-mark {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border: 1px solid #fdba74;
            border-radius: 12px;
            background: #ffffff;
            color: #c2410c;
            font-weight: 950;
        }

        .pitcher-state-card strong {
            display: block;
            font-size: 15px;
            font-weight: 950;
        }

        .pitcher-state-card span {
            display: block;
            margin-top: 3px;
            color: var(--muted);
            font-size: 12px;
            font-weight: 850;
        }

        

        /* =========================================================
           10. Record / Lineup
        ========================================================= */
        .record-table,
        .lineup-grid {
            display: grid;
            gap: 12px;
            padding: 14px;
        }

        .lineup-grid {
            grid-template-columns: 1fr 1fr;
        }

        .record-team,
        .lineup-team {
            padding: 13px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #ffffff;
            overflow-x: auto;
        }

        .record-team h3,
        .lineup-team h4 {
            margin: 0 0 10px;
            color: var(--text);
            font-size: 16px;
        }

        .record-summary {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 7px;
            margin-bottom: 12px;
        }

        .record-summary span {
            padding: 8px 6px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--soft);
            text-align: center;
            font-size: 13px;
            font-weight: 950;
        }

        .record-summary b {
            display: block;
            margin-bottom: 3px;
            color: var(--muted);
            font-size: 11px;
        }

        .record-compare {
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #ffffff;
        }

        .compare-head {
            display: grid;
            grid-template-columns: 1fr 44px 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: 950;
            text-align: center;
        }

        .compare-head span:nth-child(2) {
            color: var(--muted);
            font-size: 13px;
        }

        .compare-row {
            display: grid;
            grid-template-columns: 1fr 42px 1fr;
            align-items: center;
            gap: 8px;
            margin: 7px 0;
            color: #475569;
            font-size: 12px;
            font-weight: 800;
        }

        .compare-side {
            display: grid;
            grid-template-columns: 28px 1fr;
            align-items: center;
            gap: 7px;
        }

        .compare-side.away {
            grid-template-columns: 1fr 28px;
        }

        .compare-bar {
            height: 7px;
            border-radius: 999px;
            background: #eef2f7;
            overflow: hidden;
        }

        .compare-fill {
            height: 100%;
            background: var(--blue);
        }

        .compare-fill.away {
            margin-left: auto;
            background: #ef476f;
        }

        .record-table table {
            min-width: 720px;
        }

        .record-table th,
        .record-table td {
            padding: 9px 8px;
            border-bottom: 1px solid var(--line-soft);
            color: #334155;
            text-align: center;
            font-size: 13px;
            white-space: nowrap;
        }

        .record-table th:first-child,
        .record-table td:first-child {
            color: var(--text);
            text-align: left;
            font-weight: 950;
        }

        .lineup-list {
            display: grid;
            gap: 6px;
        }

        .lineup-section-title {
            margin: 13px 0 6px;
            padding: 7px 10px;
            border-radius: 999px;
            background: #eef4ff;
            color: var(--blue);
            font-size: 12px;
            font-weight: 950;
        }

        .lineup-section-title:first-child {
            margin-top: 0;
        }

        .lineup-item {
            display: grid;
            grid-template-columns: 34px 1fr 48px;
            align-items: center;
            gap: 8px;
            padding: 8px 0;
            border-bottom: 1px solid var(--line-soft);
            color: var(--text);
            font-size: 13px;
        }

        .lineup-item:last-child { border-bottom: 0; }
        .lineup-item em {
            color: var(--muted);
            font-style: normal;
            font-weight: 900;
            text-align: right;
        }

        /* =========================================================
           11. Prediction / Chat
        ========================================================= */
        .prediction,
        .chat { background: #ffffff; }

        .prediction { padding: 15px; }

        .vote-title {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            color: var(--text);
            font-size: 15px;
            font-weight: 950;
        }

        .vote-title small {
            color: var(--muted);
            font-size: 11px;
            white-space: nowrap;
        }

        .vote-match {
            margin-top: 14px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 12px;
        }

        .vote-team {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #ffffff;
            text-align: center;
        }

        .vote-team strong {
            display: block;
            margin-bottom: 3px;
            color: var(--text);
            font-size: 17px;
        }

        .vote-team span {
            color: var(--muted);
            font-size: 12px;
        }

        .vs { color: var(--muted); font-weight: 950; }

        .bar-wrap {
            margin-top: 14px;
            height: 12px;
            display: flex;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #e6edf6;
        }

        .bar-blue { width: 50%; background: #5c8dff; }
        .bar-orange { flex: 1; background: var(--orange); }

        .closed-note {
            margin-top: 10px;
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #ffffff;
            color: var(--muted);
            font-size: 12px;
            font-weight: 800;
        }

        .chat {
            height: 680px;
            display: flex;
            flex-direction: column;
        }

        .chat-list {
            flex: 1;
            display: grid;
            align-content: start;
            gap: 8px;
            padding: 12px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .chat-list::-webkit-scrollbar { width: 0; height: 0; }

        .chat-msg {
            padding: 9px 10px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--soft);
        }

        .chat-user {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            color: var(--blue);
            font-size: 12px;
            font-weight: 950;
        }

        .chat-user span:last-child { color: var(--muted); }

        .chat-text {
            color: #475569;
            font-size: 13px;
            line-height: 1.32;
        }

        .chat-form {
            display: flex;
            gap: 8px;
            padding: 12px;
            border-top: 1px solid var(--line-soft);
            background: #ffffff;
        }

        .chat-form input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            background: var(--soft);
            color: var(--text);
            outline: none;
        }

        .chat-form button {
            padding: 0 14px;
            border: 0;
            border-radius: 10px;
            background: var(--blue);
            color: #ffffff;
            font-weight: 950;
        }

        /* =========================================================
           12. Responsive
        ========================================================= */
        @media (max-width: 1100px) {
            .page { width: min(100% - 24px, 1180px); }
            .layout { grid-template-columns: 1fr; }
            .side-stack {
                position: static;
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 720px) {
            .page { width: min(100% - 18px, 1180px); }
            .score-head { grid-template-columns: 1fr; text-align: center; }
            .team,
            .team.away { justify-content: center; text-align: center; }
            .side-stack,
            .lineup-grid { grid-template-columns: 1fr; }
            .record-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .br-ground-wrap { padding: 10px; }

            .br-player,
            .br-runner { font-size: 11px; padding: 5px 8px; }
            .br-ondeck {
                right: 10px;
                bottom: 10px;
                transform: scale(.86);
                transform-origin: right bottom;
            }
            .timeline-event { grid-template-columns: 1fr; }
        }

        .live-toolbar-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .auto-refresh-toggle {
            height: 32px;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 0 11px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: #ffffff;
            color: var(--text);
            font-size: 12px;
            font-weight: 900;
            white-space: nowrap;
        }

        .auto-refresh-toggle input {
            width: 14px;
            height: 14px;
            accent-color: var(--blue);
        }

        .auto-refresh-toggle em {
            color: var(--muted);
            font-size: 11px;
            font-style: normal;
            font-weight: 850;
        }
    </style>
</head>

<body class="front-broadcast-light">
<div class="page" id="livePage">
    <main class="layout">
        <!-- =====================================================
             LEFT: Main Contents
        ====================================================== -->
        <section class="main-stack">
            <!-- ================= Top Scoreboard ================= -->
            <section class="scoreboard" aria-label="경기 스코어보드">
                <div class="score-head">
                    <div class="team home-team">
                        <div class="team-logo home" data-bind="homeLogo">-</div>
                        <div>
                            <div class="team-name" data-bind="homeName">로딩중</div>
                            <div class="team-meta" data-bind="homeMeta">경기 정보 불러오는 중</div>
                        </div>
                    </div>

                    <div class="score-core">
                        <div class="status-pill">
                            <span class="status-dot"></span>
                            <span data-bind="statusText">LIVE</span>
                        </div>
                        <div class="score-number">
                            <span data-bind="homeScore">-</span> : <span data-bind="awayScore">-</span>
                        </div>
                        <div class="score-caption" data-bind="scoreCaption">DB 연결 대기</div>
                    </div>

                    <div class="team away away-team">
                        <div>
                            <div class="team-name" data-bind="awayName">로딩중</div>
                            <div class="team-meta" data-bind="awayMeta">경기 정보 불러오는 중</div>
                        </div>
                        <div class="team-logo away" data-bind="awayLogo">-</div>
                    </div>
                </div>

                <div class="inning-board">
                    <table>
                        <thead id="inningScoreHead"></thead>
                        <tbody id="inningScoreBody"></tbody>
                    </table>
                    <div class="state-note"></div>
                </div>
            </section>

            <!-- ================= Main Tabs ================= -->
            <div class="tabs" role="tablist">
                <button class="tab active" type="button" data-tab="relay">중계</button>
                <button class="tab" type="button" data-tab="record">기록</button>
                <button class="tab" type="button" data-tab="lineup">라인업</button>
            </div>

            <!-- ================= Relay Tab ================= -->
            <section id="relay" class="tab-view relay-card">
                <div class="relay-toolbar">


                    <div class="live-toolbar-actions">
                        <label class="auto-refresh-toggle">
                            <input type="checkbox" id="autoRefreshToggle" checked>
                            <span>자동 업데이트</span>
                            <em id="autoRefreshStatus">5초마다</em>
                        </label>

                        <button class="refresh-label" type="button" id="refreshButton">
                            <span class="refresh-icon">↻</span>
                            새로고침
                        </button>
                    </div>
                </div>

                <!-- Field / Stadium -->
                <section class="br-ground-panel">
                    <div class="br-ground-wrap">
                        <div class="br-stadium">
                            <img src="/images/baseball-stadium1.png" alt="야구장 그라운드" class="br-stadium-img">

                            <div class="br-board" aria-label="그라운드 전광판">

                                <!-- 점수 / 이닝 / 아웃 -->
                                <div class="br-board-score-row">
                                    <div class="br-board-team">
                                        <span data-bind="boardHomeName">홈</span>
                                        <strong data-bind="boardHomeScore">-</strong>
                                    </div>

                                    <div class="br-board-center">
                                        <em data-bind="boardInning">-</em>
                                        <b data-bind="boardOut">0 OUT</b>
                                    </div>

                                    <div class="br-board-team">
                                        <span data-bind="boardAwayName">원정</span>
                                        <strong data-bind="boardAwayScore">-</strong>
                                    </div>
                                </div>

                                <!-- 볼카운트 / 투수 -->
                                <div class="br-board-count-row">

                                    <div class="br-count-strip">
                                        <div class="br-count-group br-count-b">
                                            <span>B</span>
                                            <i class="br-count-dot"></i>
                                            <i class="br-count-dot"></i>
                                            <i class="br-count-dot"></i>
                                        </div>

                                        <div class="br-count-group br-count-s">
                                            <span>S</span>
                                            <i class="br-count-dot"></i>
                                            <i class="br-count-dot"></i>
                                        </div>

                                        <div class="br-count-group br-count-o">
                                            <span>O</span>
                                            <i class="br-count-dot"></i>
                                            <i class="br-count-dot"></i>
                                        </div>

                                        <div class="br-pitcher-inline">
                                            <span>투수</span>
                                            <strong data-bind="boardPitcherName">곽빈</strong>
                                            <em><b data-bind="boardPitchCount">19구</b></em>
                                        </div>
                                    </div>

                                </div>

                            </div>

                            <!-- Dynamic fielders / runners / on-deck -->
                            <div id="fieldersLayer" aria-label="수비 위치"></div>
                            <div id="runnersLayer" aria-label="주자 위치"></div>

                            <div class="br-ondeck">
                                <div class="br-ondeck-title">대기타석</div>
                                <ul id="onDeckList"></ul>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Timeline -->
                <section class="br-timeline-panel">
                    <div class="br-inning-tabs" id="inningTabs"></div>
                    <div class="br-timeline-body" id="timelineBody">
                        <div class="empty-state">match_event 데이터가 없습니다.</div>
                    </div>
                </section>
            </section>

            <!-- ================= Record Tab ================= -->
            <section id="record" class="tab-view hidden">
                <section class="panel">
                    <div class="record-table" id="recordContent">
                        <div class="empty-state">백엔드에서 계산한 팀/선수 기록이 표시됩니다.</div>
                    </div>
                </section>
            </section>

            <!-- ================= Lineup Tab ================= -->
            <section id="lineup" class="tab-view hidden">
                <section class="panel">
                    <div class="lineup-grid">
                        <div class="lineup-team">
                            <h4 data-bind="homeLineupTitle">홈 라인업</h4>
                            <div class="lineup-list" id="homeLineupList"></div>
                        </div>
                        <div class="lineup-team">
                            <h4 data-bind="awayLineupTitle">원정 라인업</h4>
                            <div class="lineup-list" id="awayLineupList"></div>
                        </div>
                    </div>
                </section>
            </section>
        </section>

        <!-- =====================================================
             RIGHT: Prediction / Chat
        ====================================================== -->
        <aside class="side-stack">
            <!-- Prediction -->
            <section class="side-panel prediction">
                <div class="vote-title">
                    경기 전 승부 예측 결과
                    <small data-bind="predictionStatus">-</small>
                </div>
                <div class="vote-match">
                    <div class="vote-team">
                        <strong data-bind="predictionHomeName">홈</strong>
                        <span data-bind="predictionHomeMeta">-</span>
                    </div>
                    <div class="vs">VS</div>
                    <div class="vote-team">
                        <strong data-bind="predictionAwayName">원정</strong>
                        <span data-bind="predictionAwayMeta">-</span>
                    </div>
                </div>
                <div class="bar-wrap">
                    <div class="bar-blue" id="predictionHomeBar"></div>
                    <div class="bar-orange" id="predictionAwayBar"></div>
                </div>
                <div class="closed-note" data-bind="predictionNote">예측 데이터가 없습니다.</div>
            </section>

            <!-- Chat -->
            <section class="side-panel chat">
                <div class="panel-head">
                    <div>
                        <div class="panel-title">실시간 댓글</div>
                        <div class="panel-sub"><span id="chatCount">0</span>개 댓글</div>
                    </div>
                </div>
                <div class="chat-list" id="chatList">
                    <div class="empty-state">댓글 데이터가 없습니다.</div>
                </div>
                <form class="chat-form" id="chatForm">
                    <input id="chatInput" placeholder="댓글을 입력하세요">
                    <button type="submit">전송</button>
                </form>
            </section>
        </aside>
    </main>
</div>

<script th:inline="none">
    /* =========================================================
       01. Constants / Utilities
    ========================================================= */
    const POSITION_CLASS = {
        P: 'br-pos-p',
        C: 'br-pos-c',
        '1B': 'br-pos-1b',
        '2B': 'br-pos-2b',
        '3B': 'br-pos-3b',
        SS: 'br-pos-ss',
        LF: 'br-pos-lf',
        CF: 'br-pos-cf',
        RF: 'br-pos-rf'
    };

    const BASE_CLASS = {
        first: 'br-runner-1',
        second: 'br-runner-2',

    const AUTO_REFRESH_MS = 10000;

    function $(selector) {
        return document.querySelector(selector);
    }

    function $all(selector) {
        return Array.from(document.querySelectorAll(selector));
    }

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function setText(selectorOrName, value) {
        const target = selectorOrName.startsWith('[') || selectorOrName.startsWith('.') || selectorOrName.startsWith('#')
            ? $(selectorOrName)
            : $(`[data-bind="${selectorOrName}"]`);
        if (target) target.textContent = value ?? '-';
    }

    function numberOrZero(value) {
        const number = Number(value);
        return Number.isFinite(number) ? number : 0;
    }

    function sameId(left, right) {
        return String(left ?? '') === String(right ?? '');
    }

    function shortName(name) {
        return String(name ?? '-').replace(/\s+/g, '').slice(0, 3) || '-';
    }

    function displayPosition(position, sectionTitle = '') {
        const raw = String(position ?? '').trim();
        const upper = raw.toUpperCase();
        const map = {
            P: '투수',
            SP: '선발투수',
            RP: '불펜투수',
            C: '포수',
            '1B': '1루수',
            '2B': '2루수',
            '3B': '3루수',
            SS: '유격수',
            LF: '좌익수',
            CF: '중견수',
            RF: '우익수',
            DH: '지명타자',
            RHP: '우완투수',
            LHP: '좌완투수'
        };

        if (!raw) return '-';
        if (map[upper]) return map[upper];
        if (raw === '우투' || raw.includes('우완')) return raw.includes('투수') ? raw : `${raw}투수`;
        if (raw === '좌투' || raw.includes('좌완')) return raw.includes('투수') ? raw : `${raw}투수`;
        if (raw === sectionTitle && (raw === '후보야수' || raw === '불펜투수')) return '포지션 미지정';
        return raw;
    }

    function positionCode(position) {
        const raw = String(position ?? '').trim();
        const upper = raw.toUpperCase();
        const map = {
            P: 'P',
            SP: 'P',
            RP: 'P',
            RHP: 'P',
            LHP: 'P',
            C: 'C',
            '1B': '1B',
            '2B': '2B',
            '3B': '3B',
            SS: 'SS',
            LF: 'LF',
            CF: 'CF',
            RF: 'RF',
            DH: 'DH'
        };

        if (map[upper]) return map[upper];
        if (raw.includes('투수') || raw.includes('우투') || raw.includes('좌투') || raw.includes('우완') || raw.includes('좌완')) return 'P';
        if (raw.includes('포수')) return 'C';
        if (raw.includes('1루')) return '1B';
        if (raw.includes('2루')) return '2B';
        if (raw.includes('3루')) return '3B';
        if (raw.includes('유격')) return 'SS';
        if (raw.includes('좌익')) return 'LF';
        if (raw.includes('중견')) return 'CF';
        if (raw.includes('우익')) return 'RF';
        return upper;
    }

    function getMatchIdFromPath() {
        const params = new URLSearchParams(window.location.search);
        const queryMatchId = params.get('matchId') || params.get('gameId');
        if (queryMatchId) return queryMatchId;

        const match = window.location.pathname.match(/\/games\/(\d+)/);
        return match ? match[1] : null;
    }

    function eventTypeOf(event) {
        return String(event?.eventType ?? event?.event_type ?? '').toLowerCase();
    }

    function eventPeriodOf(event) {
        return String(event?.eventPeriod ?? event?.event_period ?? '').trim();
    }

    function eventTeamIdOf(event) {
        return event?.teamId ?? event?.team_id;
    }

    function eventPlayerIdOf(event) {
        return event?.playerId ?? event?.player_id;
    }

    function eventTimeOf(event) {
        return event?.eventTime ?? event?.event_time;
    }

    function parsePeriod(period) {
        const match = String(period ?? '').match(/^(\d+)회(초|말)$/);
        if (!match) return { inning: 0, half: '', order: 0, label: '-' };
        const inning = Number(match[1]);
        const half = match[2];
        return { inning, half, order: inning * 2 + (half === '말' ? 1 : 0), label: `${inning}회${half}` };
    }

    function sortEvents(events) {
        return [...(events || [])].sort((a, b) => {
            const aPeriod = parsePeriod(eventPeriodOf(a));
            const bPeriod = parsePeriod(eventPeriodOf(b));
            return (aPeriod.order * 100000 + numberOrZero(eventTimeOf(a))) - (bPeriod.order * 100000 + numberOrZero(eventTimeOf(b)));
        });
    }

    function nextPeriodAfter(period) {
        const parsed = parsePeriod(period);
        if (!parsed.inning) return period || '경기 전';
        if (parsed.half === '초') return `${parsed.inning}회말`;
        if (parsed.inning >= 9) return '경기 종료';
        return `${parsed.inning + 1}회초`;
    }
