    const BALL_EVENT_TYPES = new Set(['ball', 'pitch_clock_ball']);
    const STRIKE_EVENT_TYPES = new Set(['called_strike', 'swinging_strike', 'check_swing_strike', 'pitch_clock_strike', 'foul_tip', 'bunt_foul']);
    const FOUL_EVENT_TYPES = new Set(['foul', 'foul_tip', 'bunt_foul']);
    const STRIKEOUT_EVENT_TYPES = new Set(['strikeout', 'called_strikeout', 'swinging_strikeout', 'foul_tip_strikeout', 'bunt_foul_strikeout', 'pitch_clock_strikeout', 'dropped_third_strike_out']);
    const HIT_EVENT_TYPES = new Set(['single', 'double', 'triple', 'homerun']);
    const WALK_EVENT_TYPES = new Set(['walk', 'intentional_walk']);
    const OUT_EVENT_TYPES = new Set(['groundout', 'flyout', 'lineout', 'popout', 'force_out', 'tag_out', 'runner_out', 'pickoff_out', 'caught_stealing', 'sac_bunt', 'sac_fly']);
    const MULTI_OUT_EVENT_TYPES = new Set(['double_play', 'triple_play']);
    const TERMINAL_EVENT_TYPES = new Set([
        ...HIT_EVENT_TYPES, ...WALK_EVENT_TYPES, ...STRIKEOUT_EVENT_TYPES, ...OUT_EVENT_TYPES, ...MULTI_OUT_EVENT_TYPES,
        'hit_by_pitch', 'field_error', 'error', 'defensive_error', 'fielder_choice', 'fielders_choice', 'dropped_third_strike_safe'
    ]);
    const NO_AT_BAT_EVENT_TYPES = new Set(['walk', 'intentional_walk', 'hit_by_pitch', 'sac_bunt', 'sac_fly']);

    function pitchRowClass(type) {
        if (BALL_EVENT_TYPES.has(type)) return 'ball';
        if (FOUL_EVENT_TYPES.has(type)) return 'foul';
        if (TERMINAL_EVENT_TYPES.has(type)) return 'result';
        return '';
    }

    /* =========================================================
       02. API Loading
    ========================================================= */
    async function fetchJsonOrNull(url) {
        const response = await fetch(url);
        if (!response.ok) return null;
        return response.json();
    }

    async function loadBaseballLive(options = {}) {
        const silent = options.silent === true;

        if (liveLoading) return;
        liveLoading = true;

        const matchId = getMatchIdFromPath();
        if (!matchId) {
            if (!silent) {
                renderEmptyPage('matchId를 찾을 수 없습니다. URL에 ?matchId=66 형태로 전달하세요.');
            }
            liveLoading = false;
            return;
        }

        try {
            const detail = await fetchJsonOrNull(`/api/games/${encodeURIComponent(matchId)}/baseball-live`);
            const data = normalizeResponse(detail);
            renderPage(data);
            updateAutoRefreshStatus('업데이트 완료');
        } catch (error) {
            console.warn('야구 중계 API 호출 실패', error);
            updateAutoRefreshStatus('업데이트 실패');

            if (!silent) {
                renderEmptyPage('야구 중계 API 호출에 실패했습니다.');
            }
        } finally {
            liveLoading = false;
        }
    }

    function updateAutoRefreshStatus(text) {
        const target = document.getElementById('autoRefreshStatus');
        if (!target) return;

        if (text) {
            target.textContent = text;

            if (text === '업데이트 완료') {
                clearTimeout(window.__autoRefreshStatusTimer);
                window.__autoRefreshStatusTimer = setTimeout(() => {
                    if (document.getElementById('autoRefreshToggle')?.checked) {
                        target.textContent = `${AUTO_REFRESH_MS / 1000}초마다`;
                    }
                }, 1200);
            }

            return;
        }

        target.textContent = `${AUTO_REFRESH_MS / 1000}초마다`;
    }

    function startAutoRefresh() {
        stopAutoRefresh();

        autoRefreshTimer = setInterval(() => {
            loadBaseballLive({ silent: true });
        }, AUTO_REFRESH_MS);

        updateAutoRefreshStatus(`${AUTO_REFRESH_MS / 1000}초마다`);
    }

    function stopAutoRefresh() {
        if (autoRefreshTimer) {
            clearInterval(autoRefreshTimer);
            autoRefreshTimer = null;
        }
    }

    function bindAutoRefreshControls() {
        const toggle = document.getElementById('autoRefreshToggle');
        if (!toggle) return;

        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                startAutoRefresh();
                updateAutoRefreshStatus(`${AUTO_REFRESH_MS / 1000}초마다`);
            } else {
                stopAutoRefresh();
                updateAutoRefreshStatus('꺼짐');
            }
        });

        if (toggle.checked) {
            startAutoRefresh();
        } else {
            updateAutoRefreshStatus('꺼짐');
        }
    }

    function normalizeResponse(detail) {
        const data = detail || {};
        const homeTeam = data.homeTeam || {};
        const awayTeam = data.awayTeam || {};
        const scoreboard = data.scoreboard || {};

        return {
            ...data,
            homeTeam: {
                ...homeTeam,
                name: homeTeam.name || '-',
                logoText: homeTeam.logoText || shortName(homeTeam.name).slice(0, 1) || '-'
            },
            awayTeam: {
                ...awayTeam,
                name: awayTeam.name || '-',
                logoText: awayTeam.logoText || shortName(awayTeam.name).slice(0, 1) || '-'
            },
            scoreboard,
            score: {
                home: scoreboard.homeScore ?? 0,
                away: scoreboard.awayScore ?? 0
            },
            currentPeriod: data.currentPeriod || '경기 전',
            count: data.count || { balls: 0, strikes: 0, outs: 0 },
            baseState: data.baseState || {},
            currentPitcher: data.currentPitcher || null,
            fielders: data.fielders || [],
            onDeck: data.onDeck || [],
            timeline: data.timeline || [],
            playerGameStats: data.playerGameStats || [],
            pitcherGameStats: data.pitcherGameStats || [],
            events: data.events || [],
            lineup: data.lineup || [],
            comments: data.comments || [],
            prediction: data.prediction || null
        };
    }

    function isScheduledStatus(data) {
        const status = String(data?.status ?? '').toLowerCase();
        return ['scheduled', 'pre_game', 'before_game', '예정'].includes(status);
    }

    function renderScheduledTabMessage(tabId, message) {
        const tab = document.getElementById(tabId);
        if (!tab) return;
        tab.innerHTML = `
            <section class="scheduled-tab-panel">
                <div class="scheduled-tab-message">${escapeHtml(message)}</div>
            </section>
        `;
    }

    function renderScheduledTabs() {
        renderScheduledTabMessage('relay', '해당 경기의 중계는 추후 업데이트 됩니다.');
        renderScheduledTabMessage('record', '데이터 수신 시 팀/선수 기록이 업데이트 됩니다.');
        renderScheduledTabMessage('lineup', '출전 선수 명단이 확정되면 업데이트 됩니다.');
    }

    /* =========================================================
       03. Render: Page Shell
    ========================================================= */
    function renderPage(data) {
        window.__liveData = data;
        renderScoreboard(data);
        renderPrediction(data);
        renderComments(data.comments);

        if (isScheduledStatus(data)) {
            renderScheduledTabs();
            return;
        }

        renderField(data);
        renderTimeline(data);
        renderRecord(data);
        renderLineup(data);
    }

    function renderEmptyPage(message) {
        setText('scoreCaption', message);
        $('#timelineBody').innerHTML = `<div class="empty-state">${escapeHtml(message)}</div>`;
    }

    /* =========================================================
       04. Render: Scoreboard
    ========================================================= */
    function renderScoreboard(data) {
        const inningRows = normalizeInningScores(data);
        const homeScoreRow = inningRows.find(row => String(row.teamId) === String(data.homeTeam.teamId));
        const awayScoreRow = inningRows.find(row => String(row.teamId) === String(data.awayTeam.teamId));
        const homeDisplayScore = data.scoreboard?.homeScore ?? homeScoreRow?.runs ?? data.score.home;
        const awayDisplayScore = data.scoreboard?.awayScore ?? awayScoreRow?.runs ?? data.score.away;

        setText('homeLogo', data.homeTeam.logoText);
        setText('homeName', data.homeTeam.name);
        setText('homeMeta', '홈');
        setText('awayLogo', data.awayTeam.logoText);
        setText('awayName', data.awayTeam.name);
        setText('awayMeta', '원정');
        setText('statusText', `${data.status} · ${data.currentPeriod}`);
        setText('homeScore', homeDisplayScore);
        setText('awayScore', awayDisplayScore);
        setText('scoreCaption', '');

        setText('boardHomeName', shortName(data.homeTeam.name));
        setText('boardAwayName', shortName(data.awayTeam.name));
        setText('boardHomeScore', homeDisplayScore);
        setText('boardAwayScore', awayDisplayScore);
        setText('boardInning', data.currentPeriod);
        setText('boardOut', `${data.count.outs ?? 0} OUT`);
        renderCountDots('.br-count-b', data.count.balls ?? 0);
        renderCountDots('.br-count-s', data.count.strikes ?? 0);
        renderCountDots('.br-count-o', data.count.outs ?? 0);
        setText('boardPitcherName', data.currentPitcher?.name || data.currentPitcher?.playerName || '-');
        setText('boardPitchCount', data.currentPitcher
            ? `${data.currentPitcher.pitchCount ?? 0}구`
            : '-');

        renderInningScoreboard(data);
    }

    function renderCountDots(selector, activeCount) {
        const group = $(selector);
        if (!group) return;

        group.querySelectorAll('.br-count-dot').forEach((dot, index) => {
            dot.classList.toggle('on', index < numberOrZero(activeCount));
        });
    }

    function renderInningScoreboard(data) {
        const head = $('#inningScoreHead');
        const body = $('#inningScoreBody');
        if (!head || !body) return;

        head.innerHTML = `<tr><th>팀</th>${INNINGS.map(i => `<th>${i}</th>`).join('')}<th>R</th><th>H</th><th>E</th><th>B</th></tr>`;

        const rows = normalizeInningScores(data);
        body.innerHTML = rows.map(row => `
            <tr>
                <td>${escapeHtml(row.teamName)}</td>
                ${INNINGS.map((_, index) => `<td>${escapeHtml(row.innings[index] ?? '-')}</td>`).join('')}
                <td class="total">${escapeHtml(row.runs ?? 0)}</td>
                <td>${escapeHtml(row.hits ?? '-')}</td>
                <td>${escapeHtml(row.errors ?? '-')}</td>
                <td>${escapeHtml(row.walks ?? '-')}</td>
            </tr>
        `).join('');
    }

    function normalizeInningScores(data) {
        const board = data.scoreboard || {};
        const inningScores = Array.isArray(board.inningScores) ? board.inningScores : [];
        const current = parsePeriod(data.currentPeriod);
        const inningStarted = (inning, half) => {
            if (!current.inning) return false;
            if (inning < current.inning) return true;
            if (inning > current.inning) return false;
            if (half === 'away') return true;
            return String(data.currentPeriod || '').includes('말');
        };

        if (inningScores.length > 0) {
            const awayInnings = Array(9).fill('-');
            const homeInnings = Array(9).fill('-');
            inningScores.forEach(row => {
                const index = Number(row.inning) - 1;
                if (index < 0 || index > 8) return;
                awayInnings[index] = inningStarted(Number(row.inning), 'away') ? (row.away ?? 0) : '-';
                homeInnings[index] = inningStarted(Number(row.inning), 'home') ? (row.home ?? 0) : '-';
            });
            return [
                {
                    teamId: data.awayTeam.teamId,
                    teamName: data.awayTeam.name,
                    innings: awayInnings,
                    runs: board.awayScore ?? 0,
                    hits: board.awayHits ?? 0,
                    errors: board.awayErrors ?? 0,
                    walks: board.awayWalks ?? 0
                },
                {
                    teamId: data.homeTeam.teamId,
                    teamName: data.homeTeam.name,
                    innings: homeInnings,
                    runs: board.homeScore ?? 0,
                    hits: board.homeHits ?? 0,
                    errors: board.homeErrors ?? 0,
                    walks: board.homeWalks ?? 0
                }
            ];
        }

        const rows = [
            {
                teamId: data.awayTeam.teamId,
                teamName: data.awayTeam.name,
                innings: Array(9).fill('-'),
                runs: 0,
                hits: 0,
                errors: 0,
                walks: 0
            },
            {
                teamId: data.homeTeam.teamId,
                teamName: data.homeTeam.name,
                innings: Array(9).fill('-'),
                runs: 0,
                hits: 0,
                errors: 0,
                walks: 0
            }
        ];
        const rowByTeamId = new Map(rows.map(row => [String(row.teamId), row]));

        (data.events || []).forEach(event => {
            const row = rowByTeamId.get(String(eventTeamIdOf(event)));
            if (!row) return;

            const type = eventTypeOf(event);
            const period = parsePeriod(eventPeriodOf(event));
            const inningIndex = period.inning >= 1 && period.inning <= 9 ? period.inning - 1 : null;

            if (type === 'score' && inningIndex != null) {
                row.innings[inningIndex] = numberOrZero(row.innings[inningIndex]) + 1;
                row.runs += 1;
            }
            if (HIT_EVENT_TYPES.has(type)) row.hits += 1;
            if (WALK_EVENT_TYPES.has(type)) row.walks += 1;
            if (['field_error', 'error', 'defensive_error'].includes(type)) row.errors += 1;
        });

        rows.forEach(row => {
            const isAway = String(row.teamId) === String(data.awayTeam.teamId);
            row.innings = row.innings.map((value, index) => {
                const inning = index + 1;
                const started = inningStarted(inning, isAway ? 'away' : 'home');
                if (!started) return '-';
                return value === '-' ? '0' : String(value);
            });
        });

        return rows;
    }

    /* =========================================================
       05. Render: Stadium Field
       프론트는 야구 규칙 계산을 하지 않고 DTO를 표시만 한다.
    ========================================================= */
    function renderField(data) {
        renderFielders(data.fielders || []);
        renderRunners(data.baseState || {});
        renderOnDeck(data.onDeck || []);
    }

    function deriveFieldersFromLineup(lineup, homeTeamId, awayTeamId, currentPeriod) {
        const isBottom = String(currentPeriod).includes('말');
        const fieldingTeamId = isBottom ? awayTeamId : homeTeamId;
        return (lineup || []).filter(player => String(player.teamId) === String(fieldingTeamId) && player.position);
    }

    function renderFielders(fielders) {
        const layer = $('#fieldersLayer');
        if (!layer) return;

        const html = fielders
            .filter(player => POSITION_CLASS[positionCode(player.position)])
            .map(player => `
                <div class="br-player ${POSITION_CLASS[positionCode(player.position)]}">
                    ${escapeHtml(player.playerName || player.name || '-')}
                </div>
            `).join('');

        layer.innerHTML = html || '';
    }

    function renderRunners(baseState) {
        const layer = $('#runnersLayer');
        if (!layer) return;

        const runners = [
            ['first', baseState.first],
            ['second', baseState.second],
            ['third', baseState.third]
        ].filter(([, runner]) => runner);

        layer.innerHTML = runners.map(([base, runner]) => `
            <div class="br-runner ${BASE_CLASS[base]}">${escapeHtml(runner.name || runner.playerName || '주자')}</div>
        `).join('');
    }

    function renderOnDeck(onDeck) {
        const list = $('#onDeckList');
        if (!list) return;

        list.innerHTML = (onDeck || []).slice(0, 3).map((player, index) => `
            <li><span>${escapeHtml(player.orderNum ?? index + 1)}.</span>${escapeHtml(player.name || player.playerName || '-')}</li>
        `).join('') || '<li><span>-</span>대기타석 없음</li>';
    }

    /* =========================================================
       06. Render: Timeline
    ========================================================= */
    function renderTimeline(data) {
        renderInningTabs(data);
        renderTimelinePeriod(data, data.currentPeriod);
    }

    function renderInningTabs(data) {
        const tabs = $('#inningTabs');
        if (!tabs) return;

        const currentInning = parsePeriod(data.currentPeriod).inning || 1;
        tabs.innerHTML = INNINGS.map(inning => {
            const disabled = inning > currentInning;
            return `<button type="button" class="${inning === currentInning ? 'active' : ''}" data-inning="${inning}" ${disabled ? 'disabled aria-disabled="true"' : ''}>${inning}회</button>`;
        }).join('');
    }

    function renderTimelinePeriod(data, inningOrPeriod) {
        const parsed = parsePeriod(inningOrPeriod);
        const inning = parsed.inning || Number(inningOrPeriod) || 1;
        renderTimelineInning(data, inning);
    }

    function renderTimelineInning(data, inning) {
        const body = $('#timelineBody');
        if (!body) return;

        const topPeriod = `${inning}회초`;
        const bottomPeriod = `${inning}회말`;

// 모든 이닝에서 회말을 위, 회초를 아래로 표시
        const periods = [bottomPeriod, topPeriod];

        const cards = (data.timeline || []).filter(card => periods.includes(card.period));

        setText('timelineTitle', `${inning}회 타임라인`);
        setText('timelineSub', '');
        setText('timelineOut', `${data.count.outs ?? 0} OUT`);

        if (cards.length === 0) {
            body.innerHTML = `<div class="empty-state">match_event 데이터가 없어 선택한 이닝의 타임라인을 표시할 수 없습니다.</div>`;
            return;
        }

        const displayPeriods = periods
            .filter(period => cards.some(card => card.period === period));

        body.innerHTML = displayPeriods.map(period => {
            const periodCards = cards.filter(card => card.period === period);
            if (periodCards.length === 0) {
                return `<section class="period-block">
                    <div class="period-title"><span class="period-chip">${escapeHtml(period)}</span><span>타석 기록 없음</span></div>
                    <div class="empty-state">이 구간의 타석 기록이 없습니다.</div>
                </section>`;
            }

            return `<section class="period-block">
                <div class="period-title"><span class="period-chip">${escapeHtml(period)}</span></div>
                ${period === data.currentPeriod ? renderCurrentPitcherStateCard(data) : ''}
                ${periodCards.map(card => renderAtBatCardFromDto(card)).join('')}
            </section>`;
        }).join('');
    }

    function renderCurrentPitcherStateCard(data) {
        const pitcher = data.currentPitcher;
        if (!pitcher) {
            return `<div class="pitcher-state-card">
                <div class="pitcher-mark">투</div>
                <div><strong>투수 미등록</strong><span>match_lineup에 현재 투수 정보가 필요합니다.</span></div>
            </div>`;
        }

        return `<div class="pitcher-state-card">
            <div class="pitcher-mark">투</div>
            <div>
                <strong>${escapeHtml(pitcher.name || pitcher.playerName || '-')}</strong>
                <span>${escapeHtml(displayPosition(pitcher.position))} · ${escapeHtml(pitcher.inningsPitched ?? '0.0이닝')} · ${escapeHtml(pitcher.pitchCount ?? 0)}구 · ${escapeHtml(pitcher.hitsAllowed ?? 0)}피안타 · ${escapeHtml(pitcher.strikeouts ?? 0)}K</span>
            </div>
        </div>`;
    }

    function renderAtBatCardFromDto(card) {
        const stat = card.stat || {};
        const rows = card.pitches || [];
        const cardClass = card.current ? 'atbat-card current' : 'atbat-card collapsed';

        const batterName = card.batterName || card.name || stat.name || '-';
        const batterInitial = shortName(batterName).slice(0, 1) || '-';

        return `<article class="${cardClass}">
        <div class="atbat-head">
            <div class="atbat-avatar">${escapeHtml(batterInitial)}</div>
            <div>
                <div class="atbat-name">${escapeHtml(batterName)}</div>
                <div class="atbat-meta">
                    ${escapeHtml(card.orderNum ? `${card.orderNum}번 타자` : '타순 미등록')}
                    ·
                    ${escapeHtml(displayPosition(card.position))}
                </div>
            </div>
            ${card.current
            ? '<span class="atbat-badge">현재 타석</span>'
            : '<button class="atbat-toggle" type="button" data-atbat-toggle>기록 더보기</button>'}
        </div>

        <div class="current-stat-row">
            <span><b>타석</b>${escapeHtml(stat.plateAppearances ?? 0)}</span>
            <span><b>타수</b>${escapeHtml(stat.atBats ?? 0)}</span>
            <span><b>안타</b>${escapeHtml(stat.hits ?? 0)}</span>
            <span><b>득점</b>${escapeHtml(stat.runs ?? 0)}</span>
            <span><b>타점</b>${escapeHtml(stat.rbi ?? 0)}</span>
            <span><b>볼넷</b>${escapeHtml(stat.walks ?? 0)}</span>
            <span><b>삼진</b>${escapeHtml(stat.strikeouts ?? 0)}</span>
        </div>

        <div class="atbat-detail">
            <div class="pitch-list">
                ${rows.length ? rows.map(row => {
            if (!row.actualPitch) {
                return `<div class="pitch-event-row">
                            <b>${escapeHtml(row.label)}</b>
                            ${row.description ? ` · ${escapeHtml(row.description)}` : ''}
                        </div>`;
            }

            return `<div class="pitch-row ${escapeHtml(pitchRowClass(row.eventType))}">
                        <div class="pitch-number">${escapeHtml(row.pitchNo)}구</div>
                        <div class="pitch-main">
                            <b>${escapeHtml(row.label)}</b>
                            <span>${escapeHtml(row.description || '')}</span>
                        </div>
                        <div class="pitch-count">${escapeHtml(row.countText || '')}</div>
                    </div>`;
        }).join('') : '<div class="empty-state">이번 타석 투구 기록이 없습니다.</div>'}
            </div>
        </div>
    </article>`;
    }

    /* =========================================================
       07. Render: Record / Lineup
    ========================================================= */
    function renderRecord(data) {
        const target = $('#recordContent');
        if (!target) return;

        const board = data.scoreboard || {};
        const playerRows = data.playerGameStats || [];
        const pitcherRows = data.pitcherGameStats || [];
        const teamGroups = [
            {
                team: data.homeTeam,
                runs: board.homeScore ?? 0,
                hits: board.homeHits ?? 0,
                walks: board.homeWalks ?? 0,
                errors: board.homeErrors ?? 0,
                batters: sortGameStats(playerRows.filter(stat => sameId(stat.teamId, data.homeTeam.teamId))),
                pitchers: pitcherRows.filter(stat => sameId(stat.teamId, data.homeTeam.teamId))
            },
            {
                team: data.awayTeam,
                runs: board.awayScore ?? 0,
                hits: board.awayHits ?? 0,
                walks: board.awayWalks ?? 0,
                errors: board.awayErrors ?? 0,
                batters: sortGameStats(playerRows.filter(stat => sameId(stat.teamId, data.awayTeam.teamId))),
                pitchers: pitcherRows.filter(stat => sameId(stat.teamId, data.awayTeam.teamId))
            }
        ];
        const homeStrikeouts = sumBy(teamGroups[0].batters, 'strikeouts');
        const awayStrikeouts = sumBy(teamGroups[1].batters, 'strikeouts');

        target.innerHTML = `
            ${renderTeamComparison(data.homeTeam, data.awayTeam, [
                ['득점', teamGroups[0].runs, teamGroups[1].runs],
                ['안타', teamGroups[0].hits, teamGroups[1].hits],
                ['볼넷', teamGroups[0].walks, teamGroups[1].walks],
                ['삼진', homeStrikeouts, awayStrikeouts],
                ['실책', teamGroups[0].errors, teamGroups[1].errors]
            ])}
            ${teamGroups.map(group => `
                <div class="record-team">
                    <h3>${escapeHtml(group.team.name)} 타자 경기 기록</h3>
                    ${renderBatterRecordTable(group.batters)}
                </div>
                <div class="record-team">
                    <h3>${escapeHtml(group.team.name)} 투수 경기 기록</h3>
                    ${renderPitcherRecordTable(group.pitchers)}
                </div>
            `).join('')}
        `;
    }

    function renderTeamComparison(homeTeam, awayTeam, metrics) {
        return `<div class="record-compare">
            <div class="compare-head">
                <strong>${escapeHtml(homeTeam.name)}</strong>
                <span>VS</span>
                <strong>${escapeHtml(awayTeam.name)}</strong>
            </div>
            ${metrics.map(([label, homeValue, awayValue]) => {
                const home = numberOrZero(homeValue);
                const away = numberOrZero(awayValue);
                const total = Math.max(1, home + away);
                return `<div class="compare-row">
                    <div class="compare-side">
                        <span>${escapeHtml(home)}</span>
                        <div class="compare-bar"><div class="compare-fill" style="width:${Math.round(home / total * 100)}%"></div></div>
                    </div>
                    <b>${escapeHtml(label)}</b>
                    <div class="compare-side away">
                        <div class="compare-bar"><div class="compare-fill away" style="width:${Math.round(away / total * 100)}%"></div></div>
                        <span>${escapeHtml(away)}</span>
                    </div>
                </div>`;
            }).join('')}
        </div>`;
    }

    function renderBatterRecordTable(rows) {
        if (!rows.length) return '<div class="empty-state">타자 기록이 없습니다.</div>';
        return `<table>
            <thead>
                <tr>
                    <th>선수명</th>
                    <th>타석</th>
                    <th>타수</th>
                    <th>안타</th>
                    <th>득점</th>
                    <th>타점</th>
                    <th>볼넷</th>
                    <th>삼진</th>
                    <th>도루</th>
                </tr>
            </thead>
            <tbody>
                ${rows.map(stat => `
                    <tr>
                        <td>${escapeHtml(stat.name)}</td>
                        <td>${escapeHtml(stat.plateAppearances ?? 0)}</td>
                        <td>${escapeHtml(stat.atBats ?? 0)}</td>
                        <td>${escapeHtml(stat.hits ?? 0)}</td>
                        <td>${escapeHtml(stat.runs ?? 0)}</td>
                        <td>${escapeHtml(stat.rbi ?? 0)}</td>
                        <td>${escapeHtml(stat.walks ?? 0)}</td>
                        <td>${escapeHtml(stat.strikeouts ?? 0)}</td>
                        <td>${escapeHtml(stat.steals ?? 0)}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;
    }

    function renderPitcherRecordTable(rows) {
        if (!rows.length) return '<div class="empty-state">투수 기록이 없습니다.</div>';
        return `<table>
            <thead>
                <tr>
                    <th>투수명</th>
                    <th>이닝</th>
                    <th>투구수</th>
                    <th>피안타</th>
                    <th>K</th>
                    <th>볼넷</th>
                </tr>
            </thead>
            <tbody>
                ${rows.map(stat => `
                    <tr>
                        <td>${escapeHtml(stat.name)}</td>
                        <td>${escapeHtml(stat.inningsPitched)}</td>
                        <td>${escapeHtml(stat.pitchCount)}</td>
                        <td>${escapeHtml(stat.hitsAllowed)}</td>
                        <td>${escapeHtml(stat.strikeouts)}</td>
                        <td>${escapeHtml(stat.walksAllowed)}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>`;
    }

    function sortGameStats(rows) {
        return [...rows].sort((a, b) => {
            const orderA = numberOrZero(a.orderNum || 999);
            const orderB = numberOrZero(b.orderNum || 999);
            if (orderA !== orderB) return orderA - orderB;
            return String(a.name || '').localeCompare(String(b.name || ''), 'ko');
        });
    }

    function sumBy(rows, key) {
        return rows.reduce((sum, row) => sum + numberOrZero(row[key]), 0);
    }

    function renderLineup(data) {
        setText('homeLineupTitle', `${data.homeTeam.name} 라인업`);
        setText('awayLineupTitle', `${data.awayTeam.name} 라인업`);

        renderLineupList('#homeLineupList', data.lineup.filter(player => String(player.teamId) === String(data.homeTeam.teamId)));
        renderLineupList('#awayLineupList', data.lineup.filter(player => String(player.teamId) === String(data.awayTeam.teamId)));
    }

    function renderLineupList(selector, rows) {
        const target = $(selector);
        if (!target) return;

        if (!rows || rows.length === 0) {
            target.innerHTML = '<div class="empty-state">라인업 데이터가 없습니다.</div>';
            return;
        }

        const orderNum = player => numberOrZero(player.orderNum ?? player.order_num);
        const isStarter = player => player.starter === true
            || player.isStarter === true
            || player.is_starter === true
            || String(player.starter).toLowerCase() === 'true'
            || String(player.isStarter).toLowerCase() === 'true';

        const isPitcher = player => {
            const position = String(player.position || '').trim();
            const upper = position.toUpperCase();
            return ['P', 'SP', 'RP', 'RHP', 'LHP'].includes(upper)
                || position.includes('투수')
                || position.includes('우투')
                || position.includes('좌투')
                || position.includes('우완')
                || position.includes('좌완');
        };

        const startingPitchers = rows
            .filter(player => isStarter(player))
            .filter(player => isPitcher(player) || orderNum(player) >= 90)
            .slice(0, 1);

        const starterFielders = rows
            .filter(player => isStarter(player))
            .filter(player => !isPitcher(player))
            .filter(player => orderNum(player) >= 1 && orderNum(player) <= 9)
            .sort((a, b) => orderNum(a) - orderNum(b));

        const starterRows = [
            ...startingPitchers.map(player => ({ player, label: '선발', section: '선발' })),
            ...starterFielders.map(player => ({ player, label: orderNum(player) || '-', section: '선발' }))
        ];

        const benchFielders = rows
            .filter(player => !isStarter(player))
            .filter(player => !isPitcher(player));

        const bullpenPitchers = rows
            .filter(player => !isStarter(player))
            .filter(isPitcher);

        const sections = [
            ['선발', starterRows],
            ['후보야수', benchFielders.map(player => ({ player, label: '-', section: '후보야수' }))],
            ['불펜투수', bullpenPitchers.map(player => ({ player, label: '-', section: '불펜투수' }))]
        ];

        target.innerHTML = sections.map(([title, players]) => {
            if (players.length === 0) return '';
            return `<div class="lineup-section-title">${escapeHtml(title)}</div>` + players.map(({ player, label, section }) => `
                <div class="lineup-item">
                    <b>${escapeHtml(label)}</b>
                    <span>${escapeHtml(player.playerName || player.name || '-')}</span>
                    <em>${escapeHtml(displayPosition(player.position, section))}</em>
                </div>
            `).join('');
        }).join('') || '<div class="empty-state">표시할 라인업 데이터가 없습니다.</div>';
    }

    /* =========================================================
       08. Render: Prediction / Chat
    ========================================================= */
    function renderPrediction(data) {
        const prediction = data.prediction;
        if (!prediction) {
            setText('predictionStatus', '데이터 없음');
            return;
        }

        const homePercent = Math.max(0, Math.min(100, numberOrZero(prediction.homePercent)));
        const awayPercent = Math.max(0, Math.min(100, numberOrZero(prediction.awayPercent)));

        setText('predictionStatus', prediction.closed ? '투표 마감' : '투표 진행');
        setText('predictionHomeName', prediction.homeTeamName || data.homeTeam.name);
        setText('predictionAwayName', prediction.awayTeamName || data.awayTeam.name);
        setText('predictionHomeMeta', `${homePercent}% · ${prediction.homeVoteCount ?? 0}표`);
        setText('predictionAwayMeta', `${awayPercent}% · ${prediction.awayVoteCount ?? 0}표`);
        setText('predictionNote', prediction.closed ? '경기 시작 전 참여한 예측 결과입니다.' : '참여 가능한 예측입니다.');

        $('#predictionHomeBar').style.width = `${homePercent}%`;
        $('#predictionAwayBar').style.flex = Math.max(0, awayPercent);
    }

    function renderComments(comments) {
        const list = $('#chatList');
        const count = $('#chatCount');
        if (!list || !count) return;

        const rows = Array.isArray(comments) ? comments : [];
        count.textContent = rows.length;

        if (rows.length === 0) {
            list.innerHTML = '<div class="empty-state">댓글 데이터가 없습니다.</div>';
            return;
        }

        list.innerHTML = rows.map(comment => `
            <div class="chat-msg">
                <div class="chat-user"><b>${escapeHtml(comment.userName || comment.nickname || '-')}</b><span>${escapeHtml(comment.writtenAt || comment.createdAt || '')}</span></div>
                <div class="chat-text">${escapeHtml(comment.text || comment.content || '')}</div>
            </div>
        `).join('');
    }

    /* =========================================================
       09. Events
    ========================================================= */
    document.addEventListener('click', event => {
        const atBatToggle = event.target.closest('[data-atbat-toggle]');
        if (atBatToggle) {
            const card = atBatToggle.closest('.atbat-card');
            if (!card) return;

            const collapsed = card.classList.toggle('collapsed');
            atBatToggle.textContent = collapsed ? '기록 더보기' : '접기';
            return;
        }

        const tab = event.target.closest('.tab[data-tab]');
        if (tab) {
            const targetView = document.getElementById(tab.dataset.tab);
            if (!targetView) return;

            $all('.tab').forEach(item => item.classList.remove('active'));
            $all('.tab-view').forEach(view => view.classList.add('hidden'));
            tab.classList.add('active');
            targetView.classList.remove('hidden');
            return;
        }

        const inningButton = event.target.closest('[data-inning]');
        if (inningButton) {
            if (inningButton.disabled || inningButton.getAttribute('aria-disabled') === 'true') return;
            const inning = Number(inningButton.dataset.inning);
            $all('[data-inning]').forEach(button => button.classList.remove('active'));
            inningButton.classList.add('active');
            if (window.__liveData) renderTimelineInning(window.__liveData, inning);
        }
    });

    $('#refreshButton')?.addEventListener('click', () => {
        loadBaseballLive({ silent: false });
    });

    $('#chatForm')?.addEventListener('submit', event => {
        event.preventDefault();
        const input = $('#chatInput');
        if (input) input.value = '';
    });

    document.addEventListener('DOMContentLoaded', () => {
        loadBaseballLive({ silent: false });
        bindAutoRefreshControls();
    });

</script>
<script src="/gnb.js"></script>
</body>
