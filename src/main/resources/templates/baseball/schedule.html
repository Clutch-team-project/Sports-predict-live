<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI.MATCH - KBO 일정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        .light-portal-view {
            background-color: #cbd5e1;
            background-image:
                linear-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="light-portal-view text-slate-800 min-h-screen flex flex-col antialiased">

<!-- SUB NAV -->
<nav class="w-full border-b border-slate-300 bg-white p-2.5 flex items-center justify-center shadow-sm">
    <div class="max-w-5xl mx-auto flex items-center gap-14 justify-center text-slate-500 font-extrabold w-full text-base">
        <span class="hover:text-slate-800 cursor-pointer" onclick="location.href='/baseball/news'">뉴스</span>
        <span class="text-blue-600 border-b-2 border-blue-500 pb-1 font-black">일정</span>
        <span class="hover:text-slate-800 cursor-pointer" onclick="location.href='/baseball/standings'">순위</span>
        <span class="hover:text-slate-800 cursor-pointer" onclick="location.href='/baseball/board'">게시판</span>
    </div>
</nav>

<!-- MAIN -->
<main class="flex-1 max-w-5xl mx-auto w-full px-6 py-8 space-y-6">

    <!-- 시즌 타이틀 -->
    <div class="flex justify-center items-center gap-5 mb-2">
        <div class="bg-white border border-slate-300 rounded-xl px-4 py-2 text-sm font-bold shadow-sm">정규시즌</div>
        <div class="text-5xl font-black text-slate-800">2026</div>
    </div>

    <!-- 주간 날짜 슬라이더 -->
    <div class="bg-white border border-slate-300 rounded-3xl p-5 shadow-md">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3.5 mb-3 text-sm">
            <button id="btn-prev-week" class="text-slate-400 hover:text-slate-800 font-extrabold px-3 py-1">&lt; 이전 주</button>
            <span id="week-label" class="font-black text-blue-600 text-base"></span>
            <button id="btn-next-week" class="text-slate-400 hover:text-slate-800 font-extrabold px-3 py-1">다음 주 &gt;</button>
        </div>
        <div id="week-days" class="grid grid-cols-7 gap-2 text-center text-xs md:text-sm font-bold"></div>
    </div>

    <!-- 경기 목록 -->
    <div class="bg-white border border-slate-300 rounded-3xl p-6 shadow-md">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-5">
            <span class="text-xs font-black text-blue-600">KBO 경기 일정</span>
            <span id="match-date-label" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-xl text-xs font-bold"></span>
        </div>
        <div id="match-list" class="space-y-3">
            <div class="text-center text-slate-400 py-8">불러오는 중...</div>
        </div>
    </div>

</main>

<script src="/gnb.js"></script>
<script src="/notification.js"></script>
<script>
    const BASE_URL = 'http://localhost:8080';
    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

    let currentDate = new Date();
    let selectedDate = new Date();

    //  날짜 유틸
    function toDateStr(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}${m}${d}`;
    }

    function toDisplayDate(date) {
        return `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')}`;
    }

    function isSameDay(a, b) {
        return a.getFullYear() === b.getFullYear() &&
               a.getMonth() === b.getMonth() &&
               a.getDate() === b.getDate();
    }

    //  주간 슬라이더 렌더링
    function getWeekStart(date) {
        const d = new Date(date);
        d.setDate(d.getDate() - d.getDay()); // 일요일 기준
        return d;
    }

    function renderWeek() {
        const weekStart = getWeekStart(currentDate);
        const year = selectedDate.getFullYear();
        const month = selectedDate.getMonth() + 1;
        document.getElementById('week-label').textContent =
            `📅 ${year}년 ${month}월 KBO`;

        const container = document.getElementById('week-days');
        container.innerHTML = '';

        for (let i = 0; i < 7; i++) {
            const d = new Date(weekStart);
            d.setDate(weekStart.getDate() + i);

            const isToday   = isSameDay(d, new Date());
            const isSelected = isSameDay(d, selectedDate);

            const div = document.createElement('div');
            if (isSelected) {
                div.className = 'p-2.5 bg-blue-600 rounded-2xl text-white shadow-md cursor-pointer';
                div.innerHTML = `<div class="font-black mb-1 text-[11px]">${isToday ? '오늘' : DAY_NAMES[d.getDay()]}</div><div class="font-black text-base">${d.getDate()}</div>`;
            } else if (isToday) {
                div.className = 'p-2.5 bg-blue-50 border border-blue-300 rounded-2xl cursor-pointer';
                div.innerHTML = `<div class="text-blue-600 font-black mb-1 text-[11px]">오늘</div><div class="text-blue-600 font-black">${d.getDate()}</div>`;
            } else {
                div.className = 'p-2.5 rounded-xl hover:bg-slate-50 cursor-pointer';
                div.innerHTML = `<div class="text-slate-400 mb-1 text-[11px]">${DAY_NAMES[d.getDay()]}</div><div class="text-slate-800 font-extrabold">${d.getDate()}</div>`;
            }

            const captured = new Date(d);
            div.addEventListener('click', () => {
                selectedDate = captured;
                renderWeek();
                loadMatches();
            });
            container.appendChild(div);
        }
    }

    //  이전/다음 주
    document.getElementById('btn-prev-week').addEventListener('click', () => {
        currentDate.setDate(currentDate.getDate() - 7);
        renderWeek();
    });
    document.getElementById('btn-next-week').addEventListener('click', () => {
        currentDate.setDate(currentDate.getDate() + 7);
        renderWeek();
    });

    //  경기 상태 렌더링
    function renderStatus(match) {
        if (match.status === 'finished') {
            return `<div class="w-1/3 text-center font-black text-slate-700 text-sm">
                <span class="text-xl font-black">${match.awayScore}</span>
                <span class="text-slate-400 mx-1">:</span>
                <span class="text-xl font-black">${match.homeScore}</span>
                <div class="text-[10px] text-slate-400 mt-0.5">종료</div>
            </div>`;
        }
        if (match.status === 'in_progress') {
            return `<div class="w-1/3 text-center">
                <div class="text-emerald-600 font-black animate-pulse text-xs">LIVE</div>
                <div class="font-black text-sm mt-0.5">${match.awayScore} : ${match.homeScore}</div>
            </div>`;
        }
        if (match.status === 'cancelled') {
            return `<div class="w-1/3 text-center text-red-600 px-3 py-1 rounded-xl text-xs font-black bg-red-50 border border-red-200">취소</div>`;
        }
        // scheduled
        return `<div class="w-1/3 text-center font-black text-slate-500 text-sm">${match.scheduledAt}</div>`;
    }

    function renderActionBtn(match) {
        if (match.status === 'in_progress') {
            return `<button class="bg-red-500 text-white text-xs font-black px-4 py-1.5 rounded-xl animate-pulse">라이브</button>`;
        }
        if (match.status === 'finished') {
            return `<button class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-4 py-1.5 rounded-xl">결과</button>`;
        }
        return `<button class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-4 py-1.5 rounded-xl">전력분석</button>`;
    }

    function resultLabel(result, m) {
        if (result === 'HOME_WIN') return `${m.homeTeamName} 승`;
        if (result === 'AWAY_WIN') return `${m.awayTeamName} 승`;
        return '무승부';
    }

    function predBtnClass(selected) {
        return selected
            ? 'flex-1 py-2 rounded-xl text-xs font-black bg-blue-600 text-white shadow-sm transition-all'
            : 'flex-1 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-blue-50 hover:text-blue-600 transition-all';
    }

    function renderPrediction(m, pred) {
        const el = document.getElementById(`pred-${m.matchId}`);
        if (!el) return;

        if (m.status === 'scheduled') {
            const cur = pred ? pred.predictedResult : null;
            el.innerHTML = `
                <div class="px-4 pb-3 pt-2">
                    <div class="flex items-center gap-1.5">
                        <span class="text-[10px] text-slate-400 font-bold mr-1">승부예측</span>
                        <button onclick="submitPrediction(${m.matchId}, 'AWAY_WIN', '${m.awayTeamName}', '${m.homeTeamName}')"
                                class="${predBtnClass(cur === 'AWAY_WIN')}" id="pbtn-${m.matchId}-AWAY_WIN">
                            ${m.awayTeamName} 승
                        </button>
                        <button onclick="submitPrediction(${m.matchId}, 'DRAW', '${m.awayTeamName}', '${m.homeTeamName}')"
                                class="${predBtnClass(cur === 'DRAW')}" id="pbtn-${m.matchId}-DRAW">
                            무승부
                        </button>
                        <button onclick="submitPrediction(${m.matchId}, 'HOME_WIN', '${m.awayTeamName}', '${m.homeTeamName}')"
                                class="${predBtnClass(cur === 'HOME_WIN')}" id="pbtn-${m.matchId}-HOME_WIN">
                            ${m.homeTeamName} 승
                        </button>
                    </div>
                    ${cur ? `<p class="text-[10px] text-slate-400 text-center mt-1">경기 시작 전까지 변경 가능</p>` : ''}
                </div>`;
            return;
        }
        if (pred && m.status === 'finished') {
            let resultBadge;
            if (pred.isCorrect === null || pred.isCorrect === undefined) {
                resultBadge = `<span class="text-xs font-bold px-3 py-1 rounded-xl bg-amber-50 text-amber-600 border border-amber-200">집계 중...</span>`;
            } else if (pred.isCorrect) {
                resultBadge = `<span class="text-xs font-bold px-3 py-1 rounded-xl bg-green-50 text-green-700 border border-green-200"> 맞음 +100P</span>`;
            } else {
                resultBadge = `<span class="text-xs font-bold px-3 py-1 rounded-xl bg-red-50 text-red-500 border border-red-200">✗ 틀림</span>`;
            }
            el.innerHTML = `
                <div class="flex items-center justify-center gap-2 px-4 pb-3 pt-2">
                    <span class="text-[10px] text-slate-400 font-bold">내 예측</span>
                    <span class="text-xs font-bold px-3 py-1 rounded-xl bg-blue-50 text-blue-600 border border-blue-200">
                        ${resultLabel(pred.predictedResult, m)}
                    </span>
                    ${resultBadge}
                </div>`;
            return;
        }
        if (pred) {
            el.innerHTML = `
                <div class="flex items-center justify-center gap-2 px-4 pb-3 pt-2">
                    <span class="text-[10px] text-slate-400 font-bold">내 예측</span>
                    <span class="text-xs font-bold px-3 py-1 rounded-xl bg-blue-50 text-blue-600 border border-blue-200">
                        ${resultLabel(pred.predictedResult, m)}
                    </span>
                </div>`;
        }
    }

    // 예측 제출
    async function submitPrediction(matchId, result, awayName, homeName) {
        if (!localStorage.getItem('accessToken')) {
            if (confirm('로그인 후 이용 가능합니다.\n로그인 페이지로 이동하시겠습니까?')) location.href = '/login';
            return;
        }
        try {
            const res = await authFetch(`${BASE_URL}/api/predictions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ matchId, sportCode: 'baseball', predictedResult: result })
            });
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                alert(err.message || '예측 제출에 실패했습니다.');
                return;
            }
            const pred = await res.json();
            const fakeMatch = { matchId, homeTeamName: homeName, awayTeamName: awayName, status: 'scheduled' };
            renderPrediction(fakeMatch, pred);
        } catch (e) {
            alert('예측 제출 중 오류가 발생했습니다.');
        }
    }

    let currentMatches = [];

    //  경기 목록 로드
    async function loadMatches() {
        const dateStr = toDateStr(selectedDate);
        document.getElementById('match-date-label').textContent =
            `${toDisplayDate(selectedDate)} ${DAY_NAMES[selectedDate.getDay()]}요일`;

        const container = document.getElementById('match-list');
        container.innerHTML = '<div class="text-center text-slate-400 py-8">불러오는 중...</div>';

        try {
            const res = await authFetch(`${BASE_URL}/api/schedule/baseball?date=${dateStr}`);
            const matches = await res.json();
            currentMatches = matches;

            if (!matches.length) {
                container.innerHTML = '<div class="text-center text-slate-400 py-8 font-bold">경기가 없습니다.</div>';
                return;
            }

            container.innerHTML = matches.map(m => `
                <div class="bg-slate-50 rounded-2xl border border-slate-200 hover:border-slate-300 transition-colors">
                    <div class="flex items-center justify-between p-4">
                        <div class="w-20 flex items-center gap-2">
                            <span class="font-black text-slate-500 text-sm">${m.scheduledAt}</span>
                        </div>
                        <div class="flex-grow flex justify-around items-center px-4 text-slate-700 text-sm">
                            <div class="w-1/3 text-right font-bold text-slate-800">${m.awayTeamName}</div>
                            ${renderStatus(m)}
                            <div class="w-1/3 text-left font-bold text-slate-800">${m.homeTeamName}</div>
                        </div>
                        <div class="flex items-center gap-2 ml-2">
                            <span class="text-slate-400 text-xs">${m.venue ?? ''}</span>
                            ${renderActionBtn(m)}
                        </div>
                    </div>
                    <div class="border-t border-slate-100" id="pred-${m.matchId}"></div>
                </div>
            `).join('');

            if (localStorage.getItem('accessToken')) loadPredictions(matches);
        } catch (e) {
            container.innerHTML = '<div class="text-center text-red-400 py-8">데이터를 불러올 수 없습니다.</div>';
        }
    }

    // 내 예측 로드 후 각 경기 카드에 반영
    async function loadPredictions(matches) {
        try {
            const res = await authFetch(`${BASE_URL}/api/predictions/me`);
            if (!res.ok) return;
            const preds = await res.json();
            const predMap = {};
            preds.forEach(p => { if (p.predictionId) predMap[p.predictionId] = p; });

            // matchId 기반으로 매핑 (별도 API 대신 순차 조회)
            for (const m of matches) {
                const r = await authFetch(`${BASE_URL}/api/predictions/match/${m.matchId}`);
                if (r.status === 204) { renderPrediction(m, null); continue; }
                if (r.ok) { const pred = await r.json(); renderPrediction(m, pred); }
            }
        } catch (e) { /* 예측 로드 실패 시 무시 */ }
    }

    //  초기화
    renderWeek();
    loadMatches();
</script>
</body>
</html>
