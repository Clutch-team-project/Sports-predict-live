          rel="stylesheet">

        html { font-size: 20px; }
        body {

        /* 전체_홈 기준 라이트 배경 */
        .light-portal-view {
            background-color: #cbd5e1;

            border: 0.125rem solid rgba(59, 130, 246, 0.55);
            border-radius: 1rem;

        }

        /* 입력 필드 */

            width: 100%;
            background: #f8fafc;

            border-radius: 0.5rem;
            padding: 0.625rem 0.875rem;
            color: #1e293b;
            font-size: 0.875rem;
            outline: none;
            transition: border-color 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .input-field::placeholder {
            color: #94a3b8;
        }

        .input-field:focus {
            border-color: #2563eb;
        }

        /* 버튼 */
        .btn-primary {
            width: 100%;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 0.5rem;
            padding: 0.75rem;
            font-size: 0.875rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-outline {

            color: #475569;

            border-radius: 0.5rem;
            padding: 0.6875rem;

            cursor: pointer;

            font-family: 'Noto Sans KR', sans-serif;
        }

        .btn-outline:hover {
            border-color: #2563eb;
            color: #2563eb;
        }

        .btn-ghost {
            background: transparent;
            color: #64748b;
            border: none;
            font-size: 0.75rem;
            cursor: pointer;
            transition: color 0.2s;
            font-family: 'Noto Sans KR', sans-serif;
            text-decoration: underline;
        }

        .btn-ghost:hover {

        }

        /* 섹션 구분선 */

            border-top: 0.0625rem solid #e2e8f0;
            margin: 1.25rem 0;

        /* 섹션 타이틀 */

            font-size: 0.6875rem;
            font-weight: 700;
            color: #2563eb;

            font-weight: 600;

            border-radius: 0.75rem;

            transition: background 0.2s;

        .toggle.on {

        }

            content: '';
            position: absolute;
            width: 1.125rem;
            height: 1.125rem;
            border-radius: 50%;
            background: white;
            top: 0.1875rem;
            left: 0.1875rem;
            transition: transform 0.2s;
            box-shadow: 0 0.0625rem 0.1875rem rgba(0, 0, 0, 0.2);

            color: #64748b;
            font-size: 0.6875rem;
            font-weight: 700;

            text-align: center;
            border-bottom: 0.0625rem solid #e2e8f0;
            letter-spacing: 0.05em;
        }

        .data-table td {

            font-size: 0.8125rem;
            color: #475569;
            text-align: center;
            border-bottom: 0.0625rem solid #f1f5f9;
        }

        .data-table tr:hover td {

        }

        /* 상태 뱃지 */

            font-weight: 700;
        }

        .badge-fail {
            color: #dc2626;
            font-weight: 700;
        }

        .badge-pending {

            font-weight: 700;
        }

        .badge-plus {
            color: #16a34a;
            font-weight: 700;
        }

        .badge-minus {

        }

        /* 체크박스 */

            height: 1.125rem;

            border-radius: 0.25rem;

            transition: all 0.15s;

            justify-content: center;

        }

        .checkbox-custom.checked::after {

        }

            text-align: center;

            border-radius: 0.5rem;
            font-size: 0.8125rem;

        }
    </style>
</head>
<body class="light-portal-view text-slate-800 min-h-screen flex flex-col antialiased">

<style>
    .sport-btn {
        color: #64748b;
        cursor: pointer;
        padding-bottom: 4px;
        border-bottom: 2px solid transparent;
        transition: color 0.15s, border-color 0.15s;
    }

    .sport-btn:hover {
        color: #1e293b;
    }

    .sport-btn.active-sport {
        color: #2563eb;
        border-bottom-color: #2563eb;
        font-weight: 900;
    }

    .page-tab {
        color: #94a3b8;
        cursor: pointer;
        padding: 4px 0;
        font-size: 14px;
        border-bottom: 2px solid transparent;
        transition: color 0.15s, border-color 0.15s;
    }

    .page-tab:hover {
        color: #475569;
    }

    .page-tab.active-tab {
        color: white;
        font-weight: 900;
    }

    /* 두 번째 줄 배경: 종목 선택 시 파란색 */
    #pageNavBar .w-full {
        transition: background 0.2s;
    }

    #pageNavBar.sport-active .w-full {
        background: #2563eb;
        border-color: #1d4ed8;
    }

    #pageNavBar.sport-active .page-tab {
        color: rgba(255, 255, 255, 0.65);
    }

    #pageNavBar.sport-active .page-tab:hover {
        color: white;
    }

    #pageNavBar.sport-active .page-tab.active-tab {
        color: white;
        border-bottom-color: white;
    }
</style>

<script>
    // 종목별 탭 정의
    const SPORT_TABS = {
        home: ['뉴스', '일정', '게시판'],
        soccer: ['뉴스', '영상', '일정', '순위', '게시판'],
        baseball: ['뉴스', '영상', '일정', '순위', '게시판'],
        lol: ['뉴스', '영상', '일정', '순위', '게시판'],
    };

    let currentSport = 'home';
    let hideTimer = null;

    function renderTabs(sport, activeTab) {
        const tabs = SPORT_TABS[sport] || [];
        const list = document.getElementById('pageTabList');
        if (!list) return;
        list.innerHTML = tabs.map((t, i) =>
            `<span class="page-tab${i === 0 ? ' active-tab' : ''}" onclick="selectTab(this)">${t}</span>`
        ).join('');
        if (activeTab) {
            list.querySelectorAll('.page-tab').forEach(el => {
                el.classList.toggle('active-tab', el.textContent === activeTab);
            });
        }
    }

    function showNav(sport) {
        clearTimeout(hideTimer);
        const bar = document.getElementById('pageNavBar');
    if (!bar) return;
        currentSport = sport || currentSport;
        renderTabs(currentSport);
        bar.style.maxHeight = '52px';
        bar.style.opacity = '1';

        // 홈은 배경 흰색, 나머지 종목은 파란색
        if (currentSport === 'home') {
            bar.classList.remove('sport-active');
        } else {
            bar.classList.add('sport-active');
        }
    }

    function hideNav() {
        hideTimer = setTimeout(() => {
            const bar = document.getElementById('pageNavBar');
      if (!bar) return;
            bar.style.maxHeight = '0';
            bar.style.opacity = '0';
        }, 250);
    }

    function selectSport(el) {
        // 종목 버튼 활성화
        document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active-sport'));
        el.classList.add('active-sport');
        currentSport = el.dataset.sport;
        showNav(currentSport);
    }

    function selectTab(el) {
        document.querySelectorAll('.page-tab').forEach(b => b.classList.remove('active-tab'));
        el.classList.add('active-tab');
    }

    // 종목 버튼 hover 이벤트 — 각 버튼별 독립
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.sport-btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => showNav(btn.dataset.sport));
            btn.addEventListener('mouseleave', hideNav);
        });

        // 두 번째 줄 위에 있을 때 유지
        const bar = document.getElementById('pageNavBar');
        if (bar) {
            bar.addEventListener('mouseenter', () => clearTimeout(hideTimer));
            bar.addEventListener('mouseleave', hideNav);
        }

        // 초기 렌더
        renderTabs('home');
    });
</script>

<script>

    }

    function toggleAll() {
        const all = document.getElementById('check-all');
        const items = ['check-marketing', 'check-match', 'check-predict'];
        const willCheck = !all.classList.contains('checked');
        all.classList.toggle('checked', willCheck);
        items.forEach(id => document.getElementById(id)?.classList.toggle('checked', willCheck));
    }
</script>


<script>
    const BASE_URL = window.location.origin;

    function showMsg(msg, isError) {
        const box = document.getElementById('msg-box');
        box.textContent = msg;
        box.style.display = 'block';
        box.style.background = isError ? '#fef2f2' : '#f0fdf4';
        box.style.border = isError ? '1px solid #fca5a5' : '1px solid #86efac';
        box.style.color = isError ? '#dc2626' : '#16a34a';
    }

    function previewImage(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById('profile-preview').src = e.target.result;
            document.getElementById('profile-preview').style.display = 'block';
            document.getElementById('avatar-text').style.display = 'none';
            document.getElementById('btn-remove-image').style.display = 'inline-block';
        };
        reader.readAsDataURL(file);
    }

    let imageRemoved = false;

    function removeImage() {
        imageRemoved = true;
        document.getElementById('profile-image-input').value = '';
        document.getElementById('profile-preview').src = '';
        document.getElementById('profile-preview').style.display = 'none';
        document.getElementById('avatar-text').style.display = '';
        document.getElementById('btn-remove-image').style.display = 'none';
    }

    async function loadUserInfo() {
        const accessToken = localStorage.getItem('accessToken');
        if (!accessToken) {
            alert('로그인이 필요합니다.');
            location.href = '/login';
            return;
        }
        try {
            const res = await authFetch(BASE_URL + '/api/users/me');
            if (res.status === 401) {
                localStorage.clear();
                location.href = '/login';
                return;
            }
            const data = await res.json();
            document.getElementById('inp-login-id').value = data.loginId || '';
            document.getElementById('inp-email').value = data.email || '';
            document.getElementById('inp-name').value = data.name || '';
            document.getElementById('inp-nickname').value = data.nickname || '';
            document.getElementById('inp-phone').value = data.phone || '';
            document.getElementById('inp-birth').value = data.birthDate || '';
            if (data.marketingAgreed) document.getElementById('toggle-marketing').classList.add('on');
            else document.getElementById('toggle-marketing').classList.remove('on');
            if (data.matchStartAlert) document.getElementById('toggle-match').classList.add('on');
            else document.getElementById('toggle-match').classList.remove('on');
            if (data.predictionResultAlert) document.getElementById('toggle-predict').classList.add('on');
            else document.getElementById('toggle-predict').classList.remove('on');

            if (data.profileImage) {
                const imgSrc = data.profileImage.startsWith('http')
                    ? data.profileImage
                    : BASE_URL + '/files/view?fileName=profile/' + data.profileImage;
                document.getElementById('profile-preview').src = imgSrc;
                document.getElementById('profile-preview').style.display = 'block';
                document.getElementById('avatar-text').style.display = 'none';
                document.getElementById('btn-remove-image').style.display = 'inline-block';
            }
        } catch (e) {
            console.error('내 정보 조회 실패:', e);
        }
    }

    async function saveProfile() {
        const accessToken = localStorage.getItem('accessToken');
        if (!accessToken) {
            location.href = '/login';
            return;
        }
        const formData = new FormData();
        const name = document.getElementById('inp-name').value.trim();
        const nickname = document.getElementById('inp-nickname').value.trim();
        const phone = document.getElementById('inp-phone').value.trim();
        const birthDate = document.getElementById('inp-birth').value.trim();
        if (name) formData.append('name', name);
        if (nickname) formData.append('nickname', nickname);
        if (phone) formData.append('phone', phone);
        if (birthDate) formData.append('birthDate', birthDate);
        formData.append('marketingAgreed', document.getElementById('toggle-marketing').classList.contains('on'));
        formData.append('matchStartAlert', document.getElementById('toggle-match').classList.contains('on'));
        formData.append('predictionResultAlert', document.getElementById('toggle-predict').classList.contains('on'));
        const imageFile = document.getElementById('profile-image-input').files[0];
        if (imageFile) formData.append('profileImage', imageFile);
        if (imageRemoved) formData.append('removeProfileImage', 'true');

        try {
            const res = await authFetch(BASE_URL + '/api/users/me', {
                method: 'PUT',
                body: formData
            });
            const data = await res.json();
            if (!res.ok) {
                showMsg(data.message || '수정 실패', true);
                return;
            }
            if (data.nickname) localStorage.setItem('nickname', data.nickname);
            else localStorage.removeItem('nickname');
            showMsg('수정되었습니다.', false);
        } catch (e) {
            showMsg('서버 연결에 실패했습니다.', true);
        }
    }

    async function confirmDelete() {
        const confirmed = confirm('정말 탈퇴하시겠습니까?\n탈퇴 후 계정 복구가 불가능합니다.');
        if (!confirmed) return;

        const password = prompt('비밀번호를 입력해주세요. (소셜 전용 계정은 비워두세요)');
        if (password === null) return;  // 취소 클릭

        try {
            const res = await authFetch(BASE_URL + '/api/users/me', {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({password: password || null})
            });
            const data = await res.json();
            if (!res.ok) {
                showMsg(data.message || '탈퇴 실패', true);
                return;
            }

            alert('탈퇴가 완료되었습니다.');
            localStorage.clear();
            location.href = '/login';
        } catch (e) {
            showMsg('서버 연결에 실패했습니다.', true);
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadUserInfo();
    });
</script>

<script src="/gnb.js"></script>
</body>
</html>
