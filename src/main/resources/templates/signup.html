<style>
  .sport-btn {
    color: #64748b;

  /* 두 번째 줄 배경: 종목 선택 시 파란색 */
  #pageNavBar .w-full {
    transition: background 0.2s;
  }
  #pageNavBar.sport-active .w-full {
    background: #2563eb;
    border-color: #1d4ed8;
  }
  #pageNavBar.sport-active .page-tab {
    color: rgba(255,255,255,0.65);
  }
  #pageNavBar.sport-active .page-tab:hover {
    color: white;
  }
  #pageNavBar.sport-active .page-tab.active-tab {
    color: white;
    border-bottom-color: white;
  }
</style>

<script>
  // 종목별 탭 정의
  const SPORT_TABS = {
    home:     ['뉴스', '일정', '게시판'],
    soccer:   ['뉴스', '영상', '일정', '순위', '게시판'],
    baseball: ['뉴스', '영상', '일정', '순위', '게시판'],
    lol:      ['뉴스', '영상', '일정', '순위', '게시판'],
  };

  let currentSport = 'home';
  let hideTimer = null;

  function renderTabs(sport, activeTab) {
    const tabs = SPORT_TABS[sport] || [];
    const list = document.getElementById('pageTabList');
    list.innerHTML = tabs.map((t, i) =>
      `<span class="page-tab${i===0?' active-tab':''}" onclick="selectTab(this)">${t}</span>`
    ).join('');
    if (activeTab) {
      list.querySelectorAll('.page-tab').forEach(el => {
        el.classList.toggle('active-tab', el.textContent === activeTab);
      });
    }
  }

  function showNav(sport) {
    clearTimeout(hideTimer);
    const bar = document.getElementById('pageNavBar');
    if (!bar) return;
    currentSport = sport || currentSport;
    renderTabs(currentSport);
    bar.style.maxHeight = '52px';
    bar.style.opacity   = '1';

    // 홈은 배경 흰색, 나머지 종목은 파란색
    if (currentSport === 'home') {
      bar.classList.remove('sport-active');
    } else {
      bar.classList.add('sport-active');
    }
  }

  function hideNav() {
    hideTimer = setTimeout(() => {
      const bar = document.getElementById('pageNavBar');
      if (!bar) return;
      bar.style.maxHeight = '0';
      bar.style.opacity   = '0';
    }, 250);
  }

  function selectSport(el) {
    // 종목 버튼 활성화
    document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active-sport'));
    el.classList.add('active-sport');
    currentSport = el.dataset.sport;
    showNav(currentSport);
  }

  function selectTab(el) {
    document.querySelectorAll('.page-tab').forEach(b => b.classList.remove('active-tab'));
    el.classList.add('active-tab');
  }

  // 종목 버튼 hover 이벤트 — 각 버튼별 독립
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.sport-btn').forEach(btn => {
      btn.addEventListener('mouseenter', () => showNav(btn.dataset.sport));
      btn.addEventListener('mouseleave', hideNav);
    });

    // 두 번째 줄 위에 있을 때 유지
    const bar = document.getElementById('pageNavBar');
    if (bar) {
      bar.addEventListener('mouseenter', () => clearTimeout(hideTimer));
      bar.addEventListener('mouseleave', hideNav);
    }
    // 초기 렌더
    renderTabs('home');
  });
</script>

<script>
const BASE_URL = window.location.origin;
let emailVerified = false;
let loginIdAvailable = false;

document.addEventListener('DOMContentLoaded', () => {
  // 아이디 값이 바뀌면 이전 중복확인 결과 무효화
  document.getElementById('inp-login-id').addEventListener('input', function () {
    loginIdAvailable = false;
    const msg = document.getElementById('login-id-msg');
    if (msg) msg.style.display = 'none';
  });

  // 아이디 중복 확인 (blur)
  document.getElementById('inp-login-id').addEventListener('blur', async function () {
    const loginId = this.value.trim();
    const msg = document.getElementById('login-id-msg');
    if (!loginId) { msg.style.display = 'none'; loginIdAvailable = false; return; }
    if (!/^[a-zA-Z0-9]{4,20}$/.test(loginId)) {
      msg.style.display = 'block'; msg.style.color = '#ef4444';
      msg.textContent = '아이디는 영문/숫자 4~20자입니다.';
      loginIdAvailable = false; return;
    }
    try {
      const res = await fetch(`${BASE_URL}/api/auth/check-login-id?loginId=${encodeURIComponent(loginId)}`);
      msg.style.display = 'block';
      if (res.status === 429) {
        msg.style.color = '#ef4444';
        msg.textContent = '요청이 너무 많습니다. 잠시 후 다시 시도해주세요.';
        loginIdAvailable = false;
        return;
      }
      const data = await res.json();
      if (data.available) {
        msg.style.color = '#16a34a'; msg.textContent = '사용 가능한 아이디입니다.';
        loginIdAvailable = true;
      } else {
        msg.style.color = '#ef4444'; msg.textContent = '이미 사용 중인 아이디입니다.';
        loginIdAvailable = false;
      }
    } catch (e) {
      msg.style.display = 'none'; loginIdAvailable = false;
    }
  });

  // 비밀번호 확인 일치 여부 (blur)
  document.getElementById('inp-password-confirm').addEventListener('blur', function () {
    const pw  = document.getElementById('inp-password').value;
    const msg = document.getElementById('pw-match-msg');
    if (!this.value) { msg.style.display = 'none'; return; }
    msg.style.display = 'block';
    if (pw === this.value) {
      msg.style.color = '#16a34a'; msg.textContent = '비밀번호가 일치합니다.';
    } else {
      msg.style.color = '#ef4444'; msg.textContent = '비밀번호가 일치하지 않습니다.';
    }
  });
});
let verifyTimerInterval = null;
let _panelHideTimer = null; // hideTimer 중복 방지용 별칭

// 메시지 표시
function showMsg(msg, isError) {
  const box = document.getElementById('msg-box');
  box.textContent = msg;
  box.style.display = 'block';
  box.style.background = isError ? '#fef2f2' : '#f0fdf4';
  box.style.border     = isError ? '1px solid #fca5a5' : '1px solid #86efac';
  box.style.color      = isError ? '#dc2626' : '#16a34a';
}

// 인증코드 발송
async function sendEmailCode() {
  const email = document.getElementById('inp-email').value.trim();
  if (!email) { showMsg('이메일을 입력해주세요.', true); return; }

  const btn = document.getElementById('btn-send-code');
  btn.disabled = true;
  btn.textContent = '발송 중...';

  try {
    const res = await fetch(`${BASE_URL}/api/auth/email/send`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, purpose: 'signup' })
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg(data.message || '발송 실패', true);
      btn.disabled = false;
      btn.textContent = '인증코드 발송';
      return;
    }

    showMsg('인증코드가 발송되었습니다. 10분 내에 입력해주세요.', false);
    document.getElementById('verify-area').style.display = 'block';
    emailVerified = false;
    startVerifyTimer(600);
    btn.textContent = '재발송';
    btn.disabled = false;

  } catch (e) {
    showMsg('서버 연결에 실패했습니다.', true);
    btn.disabled = false;
    btn.textContent = '인증코드 발송';
  }
}

// 타이머
function startVerifyTimer(seconds) {
  clearInterval(verifyTimerInterval);
  const timerEl = document.getElementById('verify-timer');
  let remain = seconds;
  timerEl.textContent = `남은 시간: ${formatTime(remain)}`;
  verifyTimerInterval = setInterval(() => {
    remain--;
    if (remain <= 0) {
      clearInterval(verifyTimerInterval);
      timerEl.textContent = '인증코드가 만료되었습니다. 재발송해주세요.';
    } else {
      timerEl.textContent = `남은 시간: ${formatTime(remain)}`;
    }
  }, 1000);
}

function formatTime(s) {
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
}

// 인증코드 확인
async function verifyEmailCode() {
  const email = document.getElementById('inp-email').value.trim();
  const code  = document.getElementById('inp-code').value.trim();
  if (!code) { showMsg('인증코드를 입력해주세요.', true); return; }

  try {
    const res = await fetch(`${BASE_URL}/api/auth/email/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code, purpose: 'signup' })
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg(data.message || '인증 실패', true);
      return;
    }

    clearInterval(verifyTimerInterval);
    emailVerified = true;
    showMsg('이메일 인증이 완료되었습니다.', false);
    document.getElementById('verify-timer').textContent = '';
    document.getElementById('inp-code').disabled = true;

  } catch (e) {
    showMsg('서버 연결에 실패했습니다.', true);
  }
}

// 다음 단계 (입력 유효성 검사 후 sessionStorage 저장)
function goToNotification() {
  const loginId  = document.getElementById('inp-login-id').value.trim();
  const email    = document.getElementById('inp-email').value.trim();
  const password = document.getElementById('inp-password').value;
  const passwordConfirm = document.getElementById('inp-password-confirm').value;
  const name     = document.getElementById('inp-name').value.trim();
  const nickname = document.getElementById('inp-nickname').value.trim();
  const phone    = document.getElementById('inp-phone').value.trim();
  const birth    = document.getElementById('inp-birth').value.trim();

  // 유효성 검사
  if (!loginId)  { showMsg('아이디를 입력해주세요.', true); return; }
  if (!/^[a-zA-Z0-9]{4,20}$/.test(loginId)) { showMsg('아이디는 영문/숫자 4~20자입니다.', true); return; }
  if (!loginIdAvailable) { showMsg('아이디 중복 확인을 해주세요.', true); return; }
  if (!email)    { showMsg('이메일을 입력해주세요.', true); return; }
  if (!emailVerified) { showMsg('이메일 인증을 완료해주세요.', true); return; }
  if (!password) { showMsg('비밀번호를 입력해주세요.', true); return; }
  if (!/^(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d@$!%*#?&]{8,20}$/.test(password)) {
    showMsg('비밀번호는 영문+숫자 포함 8~20자입니다.', true); return;
  }
  if (password !== passwordConfirm) { showMsg('비밀번호가 일치하지 않습니다.', true); return; }
  if (!name)     { showMsg('이름을 입력해주세요.', true); return; }

  // 다음 페이지로 전달할 데이터 저장
  sessionStorage.setItem('signupData', JSON.stringify({
    loginId, email, password, name,
    nickname: nickname || null,
    phone: phone || null,
    birthDate: birth || null
  }));

  location.href = '/notification-agreement';
}
