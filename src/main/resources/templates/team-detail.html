<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI.MATCH — 팀 정보</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        /* 전역 UI 스케일: 기본 16px -> 18px (폰트·여백·컨테이너 비례 확대) */
        html { font-size: 18px; }
        body { font-family: 'Noto Sans KR', sans-serif; }

        .light-portal-view {
            background-color: #cbd5e1;
            background-image: linear-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
        }

        .table-row:hover { background: #f8fafc; }

        .star-btn { font-size: 22px; cursor: pointer; transition: transform 0.15s; }
        .star-btn:hover { transform: scale(1.2); }
    </style>
</head>
<body class="light-portal-view text-slate-800 min-h-screen antialiased">

<main class="max-w-7xl mx-auto px-6 py-6 space-y-4">

    <!-- 팀 헤더 카드 -->
    <div id="team-header" class="glass-card border border-slate-300 rounded-2xl shadow-md p-6">
        <div class="text-center text-slate-400 text-sm py-10">팀 정보를 불러오는 중...</div>
    </div>

    <!-- 시즌 성적 카드 -->
    <div id="season-stat" class="hidden glass-card border border-slate-300 rounded-2xl shadow-md p-6"></div>

    <div class="grid grid-cols-12 gap-4">
        <!-- 소속 선수 -->
        <div class="col-span-12 md:col-span-6 glass-card border border-slate-300 rounded-2xl shadow-md overflow-hidden">
            <div class="p-4 border-b border-slate-200 bg-slate-50/70">
                <span class="font-black text-sm text-slate-700">소속 선수</span>
            </div>
            <div class="overflow-y-auto" style="max-height: 480px;">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 text-slate-500 text-xs sticky top-0">
                    <tr>
                        <th class="p-3 pl-5">이름</th>
                        <th class="p-3 text-center">포지션</th>
                        <th class="p-3 text-center">등번호</th>
                    </tr>
                    </thead>
                    <tbody id="player-tbody" class="divide-y divide-slate-100 text-slate-700 font-medium">
                    <tr><td colspan="3" class="p-6 text-center text-slate-400 text-xs">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 최근/예정 경기 -->
        <div class="col-span-12 md:col-span-6 space-y-4">
            <div class="glass-card border border-slate-300 rounded-2xl shadow-md overflow-hidden">
                <div class="p-4 border-b border-slate-200 bg-slate-50/70">
                    <span class="font-black text-sm text-slate-700">최근 경기</span>
                </div>
                <div id="recent-matches" class="divide-y divide-slate-100">
                    <div class="p-6 text-center text-slate-400 text-xs">불러오는 중...</div>
                </div>
            </div>
            <div class="glass-card border border-slate-300 rounded-2xl shadow-md overflow-hidden">
                <div class="p-4 border-b border-slate-200 bg-slate-50/70">
                    <span class="font-black text-sm text-slate-700">예정 경기</span>
                </div>
                <div id="upcoming-matches" class="divide-y divide-slate-100">
                    <div class="p-6 text-center text-slate-400 text-xs">불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>

</main>

<script>
    const BASE_URL = window.location.origin;
    const teamId = new URLSearchParams(location.search).get('id');

    const SPORT_LABEL = { baseball: '⚾ 야구', soccer: '⚽ 축구', lol: '🎮 LOL' };

    let isFavorite = false;

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c =>
            ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // ── 관심 팀 ──────────────────────────────────────────────────────────────
    async function loadFavoriteState() {
        if (!localStorage.getItem('accessToken')) return;
        try {
            const res = await authFetch(`${BASE_URL}/api/users/me/favorites/ids`);
            if (res.ok) {
                const ids = await res.json();
                isFavorite = ids.map(Number).includes(Number(teamId));
            }
        } catch (e) { /* 무시 */ }
    }

    async function toggleFavorite() {
        if (!localStorage.getItem('accessToken')) {
            alert('로그인이 필요합니다.');
            return;
        }
        try {
            const method = isFavorite ? 'DELETE' : 'POST';
            const res = await authFetch(`${BASE_URL}/api/users/me/favorites/${teamId}`, { method });
            if (res.ok) {
                isFavorite = !isFavorite;
                renderStar();
            }
        } catch (e) { /* 무시 */ }
    }

    function renderStar() {
        const el = document.getElementById('fav-star');
        if (!el) return;
        el.textContent = isFavorite ? '★' : '☆';
        el.className = 'star-btn ' + (isFavorite ? 'text-yellow-400' : 'text-slate-300');
    }

    // ── 렌더링 ───────────────────────────────────────────────────────────────
    function renderHeader(t) {
        const emblem = t.emblemUrl
            ? `<img src="${esc(t.emblemUrl)}" alt="${esc(t.name)}" class="w-20 h-20 object-contain">`
            : `<div class="w-20 h-20 rounded-full bg-slate-200 flex items-center justify-center text-2xl font-black text-slate-400">${esc(t.name.charAt(0))}</div>`;

        document.getElementById('team-header').innerHTML = `
            <div class="flex items-center gap-6">
                ${emblem}
                <div class="flex-1">
                    <div class="flex items-center gap-3">
                        <h1 class="text-2xl font-black text-slate-900">${esc(t.name)}</h1>
                        <span id="fav-star" class="star-btn text-slate-300" onclick="toggleFavorite()">☆</span>
                    </div>
                    <div class="flex items-center gap-4 mt-2 text-sm text-slate-500 font-bold">
                        <span class="bg-blue-50 text-blue-600 border border-blue-200 px-2.5 py-0.5 rounded-lg text-xs font-black">${SPORT_LABEL[t.sportCode] || esc(t.sportName)}</span>
                        ${t.location ? `<span>연고지 · ${esc(t.location)}</span>` : ''}
                        ${t.foundedYear ? `<span>창단 · ${t.foundedYear}년</span>` : ''}
                    </div>
                </div>
            </div>`;
        renderStar();
    }

    function renderSeasonStat(s) {
        if (!s) return;
        const box = document.getElementById('season-stat');
        box.classList.remove('hidden');

        const formHtml = (s.recentForm || '').split('').map(r => {
            const color = r === 'W' ? 'bg-blue-500' : r === 'L' ? 'bg-red-400' : 'bg-slate-300';
            return `<span class="w-6 h-6 rounded-full ${color} text-white text-xs font-black flex items-center justify-center">${r === 'W' ? '승' : r === 'L' ? '패' : '무'}</span>`;
        }).join('');

        const items = [
            ['순위',  s.rank != null ? `${s.rank}위` : '-'],
            ['승률',  s.winRate != null ? Number(s.winRate).toFixed(3) : '-'],
            ['승',    s.wins],
            ['무',    s.draws],
            ['패',    s.losses],
            ['득점',  s.pointsFor],
            ['실점',  s.pointsAgainst],
        ];

        box.innerHTML = `
            <div class="flex items-center justify-between mb-4">
                <span class="font-black text-sm text-slate-700">${esc(s.season)} 시즌 성적</span>
                <div class="flex gap-1.5 items-center">
                    ${formHtml ? `<span class="text-xs text-slate-400 font-bold mr-1">최근 경기</span>${formHtml}` : ''}
                </div>
            </div>
            <div class="grid grid-cols-4 md:grid-cols-7 gap-3 text-center">
                ${items.map(([label, value]) => `
                    <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
                        <div class="text-[0.6875rem] text-slate-400 font-bold">${label}</div>
                        <div class="text-lg font-black text-slate-800 mt-0.5">${value}</div>
                    </div>`).join('')}
            </div>`;
    }

    function renderPlayers(players) {
        const tbody = document.getElementById('player-tbody');
        if (!players.length) {
            tbody.innerHTML = '<tr><td colspan="3" class="p-6 text-center text-slate-400 text-xs">등록된 선수가 없습니다.</td></tr>';
            return;
        }
        tbody.innerHTML = players.map(p => `
            <tr class="table-row cursor-pointer" onclick="goPlayerDetail(${p.playerId})">
                <td class="p-3 pl-5 font-bold text-slate-900">${esc(p.name)}</td>
                <td class="p-3 text-center text-slate-500">${esc(p.position) || '-'}</td>
                <td class="p-3 text-center text-slate-500">${p.jerseyNumber ?? '-'}</td>
            </tr>`).join('');
    }

    function matchRow(m) {
        const isFinished = m.status === 'finished';
        const isLive = m.status === 'in_progress';
        const center = isFinished || isLive
            ? `<span class="font-black ${isLive ? 'text-red-500 animate-pulse' : 'text-slate-800'}">${m.homeScore} : ${m.awayScore}</span>`
            : `<span class="text-slate-400 font-bold text-xs">${esc(m.scheduledAt)}</span>`;
        return `
            <div class="p-3.5 flex items-center justify-between text-sm">
                <span class="font-bold text-slate-700 w-[32%] truncate">${esc(m.homeTeamName)}</span>
                <div class="text-center w-[28%]">
                    ${center}
                    <div class="text-[0.625rem] text-slate-400 mt-0.5">${esc(m.date)}${isLive ? ' · LIVE' : ''}</div>
                </div>
                <span class="font-bold text-slate-700 w-[32%] truncate text-right">${esc(m.awayTeamName)}</span>
            </div>`;
    }

    function renderMatches(elId, matches, emptyMsg) {
        const el = document.getElementById(elId);
        el.innerHTML = matches.length
            ? matches.map(matchRow).join('')
            : `<div class="p-6 text-center text-slate-400 text-xs">${emptyMsg}</div>`;
    }

    // ── 초기 로드 ────────────────────────────────────────────────────────────
    async function init() {
        if (!teamId) {
            document.getElementById('team-header').innerHTML =
                '<div class="text-center text-red-400 text-sm py-10">잘못된 접근입니다.</div>';
            return;
        }
        try {
            const [res] = await Promise.all([
                fetch(`${BASE_URL}/api/teams/${teamId}`),
                loadFavoriteState()
            ]);
            if (!res.ok) throw new Error();
            const t = await res.json();

            document.title = `AI.MATCH — ${t.name}`;
            renderHeader(t);
            renderSeasonStat(t.seasonStat);
            renderPlayers(t.players);
            renderMatches('recent-matches', t.recentMatches, '최근 경기가 없습니다.');
            renderMatches('upcoming-matches', t.upcomingMatches, '예정된 경기가 없습니다.');
        } catch (e) {
            document.getElementById('team-header').innerHTML =
                '<div class="text-center text-red-400 text-sm py-10">팀 정보를 불러올 수 없습니다.</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', init);
</script>
<script src="/gnb.js"></script>
</body>
</html>
