<style>
    .sport-btn {
        color: #64748b;
        cursor: pointer;
        padding-bottom: 4px;

        transition: color 0.15s, border-color 0.15s;

    /* 두 번째 줄 배경: 종목 선택 시 파란색 */
    #pageNavBar .w-full {
        transition: background 0.2s;
    }

    #pageNavBar.sport-active .w-full {
        background: #2563eb;
        border-color: #1d4ed8;
    }

    #pageNavBar.sport-active .page-tab {
        color: rgba(255, 255, 255, 0.65);
    }

    #pageNavBar.sport-active .page-tab:hover {
        color: white;
    }

    #pageNavBar.sport-active .page-tab.active-tab {
        color: white;
        border-bottom-color: white;
    }
</style>

<script>
    // 종목별 탭 정의
    const SPORT_TABS = {
        home: ['뉴스', '일정', '게시판'],
        soccer: ['뉴스', '영상', '일정', '순위', '게시판'],
        baseball: ['뉴스', '영상', '일정', '순위', '게시판'],
        lol: ['뉴스', '영상', '일정', '순위', '게시판'],
    };

    let currentSport = 'home';
    let hideTimer = null;

    function renderTabs(sport, activeTab) {
        const tabs = SPORT_TABS[sport] || [];
        const list = document.getElementById('pageTabList');
        list.innerHTML = tabs.map((t, i) =>
            `<span class="page-tab${i === 0 ? ' active-tab' : ''}" onclick="selectTab(this)">${t}</span>`
        ).join('');
        if (activeTab) {
            list.querySelectorAll('.page-tab').forEach(el => {
                el.classList.toggle('active-tab', el.textContent === activeTab);
            });
        }
    }

    function showNav(sport) {
        clearTimeout(hideTimer);
        const bar = document.getElementById('pageNavBar');
    if (!bar) return;
        currentSport = sport || currentSport;
        renderTabs(currentSport);
        bar.style.maxHeight = '52px';
        bar.style.opacity = '1';

        // 홈은 배경 흰색, 나머지 종목은 파란색
        if (currentSport === 'home') {
            bar.classList.remove('sport-active');
        } else {
            bar.classList.add('sport-active');
        }
    }

    function hideNav() {
        hideTimer = setTimeout(() => {
            const bar = document.getElementById('pageNavBar');
      if (!bar) return;
            bar.style.maxHeight = '0';
            bar.style.opacity = '0';
        }, 250);
    }

    function selectSport(el) {
        // 종목 버튼 활성화
        document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active-sport'));
        el.classList.add('active-sport');
        currentSport = el.dataset.sport;
        showNav(currentSport);
    }

    function selectTab(el) {
        document.querySelectorAll('.page-tab').forEach(b => b.classList.remove('active-tab'));
        el.classList.add('active-tab');
    }

    // 종목 버튼 hover 이벤트 — 각 버튼별 독립
    document.addEventListener('DOMContentLoaded', () => {
        document.querySelectorAll('.sport-btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => showNav(btn.dataset.sport));
            btn.addEventListener('mouseleave', hideNav);
        });

        // 두 번째 줄 위에 있을 때 유지
        const bar = document.getElementById('pageNavBar');
        if (bar) {
            bar.addEventListener('mouseenter', () => clearTimeout(hideTimer));
            bar.addEventListener('mouseleave', hideNav);
        }
        // 초기 렌더
        renderTabs('home');
    });
</script>

<script>
    const BASE_URL = window.location.origin;
    let resetVerified = false;
    let timerInterval = null;

    function showMsg(msg, isError) {
        const box = document.getElementById('msg-box');
        box.textContent = msg;
        box.style.display = 'block';
        box.style.background = isError ? '#fef2f2' : '#f0fdf4';
        box.style.border = isError ? '1px solid #fca5a5' : '1px solid #86efac';
        box.style.color = isError ? '#dc2626' : '#16a34a';
    }

    function fmt(s) {
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
    }

    function startTimer(sec) {
        clearInterval(timerInterval);
        const el = document.getElementById('verify-timer');
        let remain = sec;
        el.textContent = '남은 시간: ' + fmt(remain);
        timerInterval = setInterval(function () {
            remain--;
            if (remain <= 0) {
                clearInterval(timerInterval);
                el.textContent = '인증코드 만료. 재발송해주세요.';
            } else el.textContent = '남은 시간: ' + fmt(remain);
        }, 1000);
    }

    async function sendResetCode() {
        const email = document.getElementById('inp-email').value.trim();
        if (!email) {
            showMsg('이메일을 입력해주세요.', true);
            return;
        }
        const btn = document.getElementById('btn-send');
        btn.disabled = true;
        btn.textContent = '발송 중...';
        try {
            const res = await fetch(BASE_URL + '/api/auth/email/send', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email, purpose: 'reset_pw'})
            });
            const data = await res.json();
            if (!res.ok) {
                showMsg(data.message || '발송 실패', true);
                btn.disabled = false;
                btn.textContent = '인증코드 발송';
                return;
            }
            showMsg('인증코드가 발송되었습니다.', false);
            document.getElementById('verify-area').style.display = 'block';
            resetVerified = false;
            startTimer(600);
            btn.textContent = '재발송';
            btn.disabled = false;
        } catch (e) {
            showMsg('서버 연결에 실패했습니다.', true);
            btn.disabled = false;
            btn.textContent = '인증코드 발송';
        }
    }

    async function verifyResetCode() {
        const email = document.getElementById('inp-email').value.trim();
        const code = document.getElementById('inp-code').value.trim();
        if (!code) {
            showMsg('인증코드를 입력해주세요.', true);
            return;
        }
        try {
            const res = await fetch(BASE_URL + '/api/auth/email/verify', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email, code: code, purpose: 'reset_pw'})
            });
            const data = await res.json();
            if (!res.ok) {
                showMsg(data.message || '인증 실패', true);
                return;
            }
            clearInterval(timerInterval);
            resetVerified = true;
            showMsg('인증 완료. 새 비밀번호를 입력해주세요.', false);
            document.getElementById('verify-timer').textContent = '';
            document.getElementById('inp-code').disabled = true;
            document.getElementById('new-pw-area').style.display = 'block';
        } catch (e) {
            showMsg('서버 연결에 실패했습니다.', true);
        }
    }

    async function resetPassword() {
        const email = document.getElementById('inp-email').value.trim();
        const newPw = document.getElementById('inp-new-pw').value;
        const confirm = document.getElementById('inp-new-pw-confirm').value;
        const code = document.getElementById('inp-code').value.trim();
        if (!resetVerified) {
            showMsg('이메일 인증을 완료해주세요.', true);
            return;
        }
        if (!newPw) {
            showMsg('새 비밀번호를 입력해주세요.', true);
            return;
        }
        if (newPw !== confirm) {
            showMsg('비밀번호가 일치하지 않습니다.', true);
            return;
        }
        try {
            const res = await fetch(BASE_URL + '/api/auth/reset-password', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email, code: code, newPassword: newPw})
            });
            const data = await res.json();
            if (!res.ok) {
                showMsg(data.message || '재설정 실패', true);
                return;
            }
            showMsg('비밀번호가 재설정되었습니다. 로그인 페이지로 이동합니다.', false);
            setTimeout(function () {
                location.href = '/login';
            }, 2000);
        } catch (e) {
            showMsg('서버 연결에 실패했습니다.', true);
        }
    }
</script>
