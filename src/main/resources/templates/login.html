<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI.MATCH — 회원 와이어프레임</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
        /* 전역 UI 스케일: 기본 1rem -> 1.125rem (폰트·여백·컨테이너 비례 확대) */
        html { font-size: 20px; }
  body { font-family: 'Noto Sans KR', sans-serif; }

  /* 전체_홈 기준 라이트 배경 */
  .light-portal-view {
    background-color: #cbd5e1;
    background-image:
      linear-gradient(rgba(148, 163, 184, 0.1) 0.0625rem, transparent 0.0625rem),
      linear-gradient(90deg, rgba(148, 163, 184, 0.1) 0.0625rem, transparent 0.0625rem);
    background-size: 1.5rem 1.5rem;
  }

  .page { display: none; }
  .page.active { display: block; }

  /* 카드 */
  .card {
    background: rgba(255,255,255,0.9);
    border: 0.125rem solid rgba(59,130,246,0.55);
    border-radius: 1rem;
    box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.08);
  }

  /* 입력 필드 */
  .input-field {
    width: 100%;
    background: #f8fafc;
    border: 0.0625rem solid #cbd5e1;
    border-radius: 0.5rem;
    padding: 0.625rem 0.875rem;
    color: #1e293b;
    font-size: 0.875rem;

    transition: border-color 0.2s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .input-field::placeholder { color: #94a3b8; }
  .input-field:focus { border-color: #2563eb; }

  /* 버튼 */
  .btn-primary {
    width: 100%;
    background: #2563eb;
    color: white;
    border: none;
    border-radius: 0.5rem;
    padding: 0.75rem;
    font-size: 0.875rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .btn-primary:hover { background: #1d4ed8; }

  .btn-outline {
    width: 100%;
    background: white;
    color: #475569;
    border: 0.0625rem solid #cbd5e1;
    border-radius: 0.5rem;
    padding: 0.6875rem;
    font-size: 0.875rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .btn-outline:hover { border-color: #2563eb; color: #2563eb; }

  .btn-ghost {
    background: transparent;
    color: #64748b;
    border: none;
    font-size: 0.75rem;
    cursor: pointer;
    transition: color 0.2s;
    font-family: 'Noto Sans KR', sans-serif;
    text-decoration: underline;
  }
  .btn-ghost:hover { color: #334155; }

  /* 섹션 구분선 */
  .section-divider {
    border: none;
    border-top: 0.0625rem solid #e2e8f0;
    margin: 1.25rem 0;
  }

  /* 섹션 타이틀 */
  .section-title {
    font-size: 0.6875rem;
    font-weight: 700;
    color: #2563eb;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.75rem;
  }

  /* 레이블 */
  .field-label {
    font-size: 0.75rem;
    font-weight: 600;
    color: #475569;
    margin-bottom: 0.375rem;
    display: block;
  }
  .required { color: #ef4444; margin-left: 0.125rem; }
  .optional { color: #94a3b8; font-weight: 400; font-size: 0.6875rem; margin-left: 0.25rem; }

  /* 토글 스위치 */
  .toggle-wrap { display: flex; align-items: center; justify-content: space-between; padding: 0.625rem 0; }
  .toggle-label { font-size: 0.8125rem; color: #475569; }
  .toggle {
    position: relative; width: 2.75rem; height: 1.5rem;
    background: #cbd5e1; border-radius: 0.75rem;
    cursor: pointer; transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle.on { background: #2563eb; }
  .toggle::after {
    content: ''; position: absolute;
    width: 1.125rem; height: 1.125rem; border-radius: 50%;
    background: white; top: 0.1875rem; left: 0.1875rem;
    transition: transform 0.2s;
    box-shadow: 0 0.0625rem 0.1875rem rgba(0,0,0,0.2);
  }
  .toggle.on::after { transform: translateX(1.25rem); }

  /* 사이드바 메뉴 */
  .sidebar-menu-item {
    padding: 0.75rem 1rem;
    font-size: 0.8125rem;
    color: #64748b;
    cursor: pointer;
    border-radius: 0.5rem;
    transition: all 0.15s;
    font-weight: 500;
  }
  .sidebar-menu-item:hover { color: #334155; background: #f1f5f9; }
  .sidebar-menu-item.active { color: white; background: #2563eb; font-weight: 700; }

  /* 테이블 */
  .data-table { width: 100%; border-collapse: collapse; }
  .data-table th {
    background: #f1f5f9;
    color: #64748b;
    font-size: 0.6875rem;
    font-weight: 700;
    padding: 0.625rem 0.875rem;
    text-align: center;
    border-bottom: 0.0625rem solid #e2e8f0;
    letter-spacing: 0.05em;
  }
  .data-table td {
    padding: 0.75rem 0.875rem;
    font-size: 0.8125rem;
    color: #475569;
    text-align: center;
    border-bottom: 0.0625rem solid #f1f5f9;
  }
  .data-table tr:hover td { background: #f8fafc; }

  /* 상태 뱃지 */
  .badge-success { color: #16a34a; font-weight: 700; }
  .badge-fail    { color: #dc2626; font-weight: 700; }
  .badge-pending { color: #d97706; font-weight: 700; }
  .badge-plus    { color: #16a34a; font-weight: 700; }
  .badge-minus   { color: #dc2626; font-weight: 700; }

  /* 체크박스 */
  .checkbox-custom {
    width: 1.125rem; height: 1.125rem;
    border: 0.125rem solid #cbd5e1;
    border-radius: 0.25rem;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: white;
  }
  .checkbox-custom.checked { background: #2563eb; border-color: #2563eb; }
  .checkbox-custom.checked::after { content: '✓'; color: white; font-size: 0.6875rem; font-weight: 700; }

  /* 프로필 이미지 */
  .avatar-placeholder {
    width: 4.5rem; height: 4.5rem;
    background: #e2e8f0;
    border-radius: 50%;
    border: 0.125rem solid #cbd5e1;
    display: flex; align-items: center; justify-content: center;
    color: #94a3b8; font-size: 0.6875rem; text-align: center;
    flex-shrink: 0;
  }

  /* 소셜 로그인 구분선 */
  .social-divider {
    display: flex; align-items: center; gap: 0.75rem;
    margin: 1rem 0;
  }
  .social-divider::before,
  .social-divider::after {
    content: ''; flex: 1;
    height: 0.0625rem; background: #e2e8f0;
  }
  .social-divider span { font-size: 0.6875rem; color: #94a3b8; white-space: nowrap; }

  /* 정보 박스 */
  .info-box {
    background: #f1f5f9;
    border: 0.0625rem solid #e2e8f0;
    border-radius: 0.5rem;
    padding: 0.875rem;
    font-size: 0.75rem;
    color: #64748b;
    text-align: center;
    line-height: 1.7;
  }

  /* GNB */
  .gnb { background: white; border-bottom: 0.0625rem solid #cbd5e1; }

  /* 네비 탭 */
  .nav-tab {
    padding: 0.5rem 1rem;
    font-size: 0.8125rem;
    font-weight: 500;
    color: #64748b;
    cursor: pointer;
    border-bottom: 0.125rem solid transparent;
    transition: all 0.15s;
  }
  .nav-tab.active { color: #2563eb; border-bottom-color: #2563eb; font-weight: 700; }
  .nav-tab:hover:not(.active) { color: #334155; }

  /* 안내 메시지 */
  .hint-text { font-size: 0.6875rem; color: #94a3b8; margin-top: 0.25rem; }

  /* 페이지 인디케이터 */
  .page-indicator {
    position: fixed; bottom: 1.25rem; left: 50%;
    transform: translateX(-50%);
    display: flex; gap: 0.375rem;
    background: rgba(255,255,255,0.92);
    padding: 0.5rem 1rem; border-radius: 1.25rem;
    border: 0.0625rem solid #cbd5e1;
    z-index: 100;
    backdrop-filter: blur(0.5rem);
    box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,0.08);
  }
  .dot {
    width: 0.5rem; height: 0.5rem; border-radius: 50%;
    background: #cbd5e1; cursor: pointer;
    transition: all 0.2s;
  }
  .dot.active { background: #2563eb; width: 1.25rem; border-radius: 0.25rem; }

  /* 페이지 레이블 */
  .page-label {
    font-size: 0.625rem;
    color: #2563eb;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
  }

  /* 비밀번호 변경 버튼 */
  .btn-sm {
    padding: 0.375rem 0.875rem;
    font-size: 0.75rem;
    font-weight: 700;
    background: #eff6ff;
    color: #2563eb;
    border: 0.0625rem solid #bfdbfe;
    border-radius: 0.375rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .btn-sm:hover { background: #dbeafe; color: #1d4ed8; }

  /* 카카오/구글 버튼 */
  .btn-kakao {
    width: 100%; padding: 0.6875rem;
    background: #FEE500; color: #3C1E1E;
    border: none; border-radius: 0.5rem;
    font-size: 0.8125rem; font-weight: 700;
    cursor: pointer; transition: opacity 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .btn-kakao:hover { opacity: 0.9; }
  .btn-google {
    width: 100%; padding: 0.6875rem;
    background: white; color: #475569;
    border: 0.0625rem solid #cbd5e1; border-radius: 0.5rem;
    font-size: 0.8125rem; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    font-family: 'Noto Sans KR', sans-serif;
  }
  .btn-google:hover { border-color: #2563eb; color: #2563eb; }

  /* 탈퇴 링크 */
  .danger-link {
    font-size: 0.75rem; color: #ef4444;
    text-decoration: underline; cursor: pointer;
  }
  .danger-link:hover { color: #dc2626; }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 0.25rem; }
  ::-webkit-scrollbar-track { background: #e2e8f0; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 0.125rem; }
</style>

<body class="light-portal-view text-slate-800 min-h-screen flex flex-col antialiased">

<style>
  .sport-btn {
    color: #64748b;
    cursor: pointer;
    padding-bottom: 4px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .sport-btn:hover { color: #1e293b; }
  .sport-btn.active-sport {
    color: #2563eb;
    border-bottom-color: #2563eb;
    font-weight: 900;
  }
  .page-tab {
    color: #94a3b8;
    cursor: pointer;
    padding: 4px 0;
    font-size: 14px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
  }
  .page-tab:hover { color: #475569; }
  .page-tab.active-tab {
    color: white;
    font-weight: 900;
  }
  /* 두 번째 줄 배경: 종목 선택 시 파란색 */
  #pageNavBar .w-full {
    transition: background 0.2s;
  }
  #pageNavBar.sport-active .w-full {
    background: #2563eb;
    border-color: #1d4ed8;
  }
  #pageNavBar.sport-active .page-tab {
    color: rgba(255,255,255,0.65);
  }
  #pageNavBar.sport-active .page-tab:hover {
    color: white;
  }
  #pageNavBar.sport-active .page-tab.active-tab {
    color: white;
    border-bottom-color: white;
  }
</style>

<script>
  // 종목별 탭 정의
  const SPORT_TABS = {
    home:     ['뉴스', '일정', '게시판'],
    soccer:   ['뉴스', '영상', '일정', '순위', '게시판'],
    baseball: ['뉴스', '영상', '일정', '순위', '게시판'],
    lol:      ['뉴스', '영상', '일정', '순위', '게시판'],
  };

  let currentSport = 'home';
  let hideTimer = null;

  function renderTabs(sport, activeTab) {
    const tabs = SPORT_TABS[sport] || [];
    const list = document.getElementById('pageTabList');
    list.innerHTML = tabs.map((t, i) =>
      `<span class="page-tab${i===0?' active-tab':''}" onclick="selectTab(this)">${t}</span>`
    ).join('');
    if (activeTab) {
      list.querySelectorAll('.page-tab').forEach(el => {
        el.classList.toggle('active-tab', el.textContent === activeTab);
      });
    }
  }

  function showNav(sport) {
    clearTimeout(hideTimer);
    const bar = document.getElementById('pageNavBar');
    if (!bar) return;
    currentSport = sport || currentSport;
    renderTabs(currentSport);
    bar.style.maxHeight = '52px';
    bar.style.opacity   = '1';

    // 홈은 배경 흰색, 나머지 종목은 파란색
    if (currentSport === 'home') {
      bar.classList.remove('sport-active');
    } else {
      bar.classList.add('sport-active');
    }
  }

  function hideNav() {
    hideTimer = setTimeout(() => {
      const bar = document.getElementById('pageNavBar');
      if (!bar) return;
      bar.style.maxHeight = '0';
      bar.style.opacity   = '0';
    }, 250);
  }

  function selectSport(el) {
    // 종목 버튼 활성화
    document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active-sport'));
    el.classList.add('active-sport');
    currentSport = el.dataset.sport;
    showNav(currentSport);
  }

  function selectTab(el) {
    document.querySelectorAll('.page-tab').forEach(b => b.classList.remove('active-tab'));
    el.classList.add('active-tab');
  }

  // 종목 버튼 hover 이벤트 — 각 버튼별 독립
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.sport-btn').forEach(btn => {
      btn.addEventListener('mouseenter', () => showNav(btn.dataset.sport));
      btn.addEventListener('mouseleave', hideNav);
    });

    // 두 번째 줄 위에 있을 때 유지
    const bar = document.getElementById('pageNavBar');
    if (bar) {
      bar.addEventListener('mouseenter', () => clearTimeout(hideTimer));
      bar.addEventListener('mouseleave', hideNav);
    }
    // 초기 렌더
    renderTabs('home');
  });
</script>

<script>
  function toggleCheck(el) { el.classList.toggle('checked'); }

  function toggleAll() {
    const all = document.getElementById('check-all');
    const items = ['check-marketing','check-match','check-predict'];
    const willCheck = !all.classList.contains('checked');
    all.classList.toggle('checked', willCheck);
    items.forEach(id => document.getElementById(id)?.classList.toggle('checked', willCheck));
  }
</script>

<script>
const BASE_URL = window.location.origin;

function showMsg(msg, isError) {
  const box = document.getElementById('msg-box');
  box.textContent = msg;
  box.style.display = 'block';
  box.style.background = isError ? '#fef2f2' : '#f0fdf4';
  box.style.border     = isError ? '1px solid #fca5a5' : '1px solid #86efac';
  box.style.color      = isError ? '#dc2626' : '#16a34a';
}

async function doLogin() {
  const loginId  = document.getElementById('inp-login-id').value.trim();
  const password = document.getElementById('inp-password').value;

  if (!loginId)  { showMsg('아이디를 입력해주세요.', true); return; }
  if (!password) { showMsg('비밀번호를 입력해주세요.', true); return; }

  const btn = document.querySelector('.btn-primary');
  btn.disabled = true;
  btn.textContent = '로그인 중...';

  try {
    const res = await fetch(`${BASE_URL}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ loginId, password })
    });
    const data = await res.json();

    if (!res.ok) {
      showMsg(data.message || '로그인에 실패했습니다.', true);
      btn.disabled = false;
      btn.textContent = '로그인';
      return;
    }

    // 토큰 및 사용자 정보 저장
    localStorage.setItem('accessToken',  data.accessToken);
    localStorage.setItem('refreshToken', data.refreshToken);
    localStorage.setItem('userId',       String(data.userId));
    localStorage.setItem('nickname',     data.nickname || '');
    localStorage.setItem('loginId',      data.loginId  || '');

    // 자동 로그인 설정 (로그인 상태 유지 체크 여부)
    const stayLogin = document.getElementById('stay-login').classList.contains('checked');
    localStorage.setItem('autoLogin', stayLogin ? 'true' : 'false');
    sessionStorage.setItem('sessionActive', '1');

    location.href = '/';

  } catch (e) {
    showMsg('서버 연결에 실패했습니다.', true);
    btn.disabled = false;
    btn.textContent = '로그인';
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// 소셜 로그인 실패 에러 메시지 처리
(function() {
  const params = new URLSearchParams(window.location.search);
  const error = params.get('error');
  if (error) {
    history.replaceState(null, '', '/login');
    alert(decodeURIComponent(error));
  }
})();
</script>
