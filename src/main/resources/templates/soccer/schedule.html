<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI.MATCH - K리그 축구 일정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        /* 전역 UI 스케일: 기본 16px -> 18px (폰트·여백·컨테이너 비례 확대) */
        html { font-size: 18px; }
        body { font-family: 'Noto Sans KR', sans-serif; }
        .light-portal-view {
            background-color: #cbd5e1;
            background-image:
                    linear-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(148, 163, 184, 0.1) 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="light-portal-view text-slate-800 min-h-screen flex flex-col antialiased">

<!-- SUB NAV -->
<nav class="w-full border-b border-slate-300 bg-white p-2.5 flex items-center justify-center shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center gap-14 justify-center text-slate-500 font-extrabold w-full text-base">
        <span class="hover:text-slate-800 cursor-pointer" onclick="event.stopPropagation(); location.href='/news?sport=축구'">뉴스</span>
        <span class="text-blue-600 border-b-2 border-blue-500 pb-1 font-black">일정</span>
        <span class="hover:text-slate-800 cursor-pointer" onclick="location.href='/soccer/standings'">순위</span>
        <span class="hover:text-slate-800 cursor-pointer" onclick="location.href='/soccer/board'">게시판</span>
    </div>
</nav>

<!-- MAIN -->
<main class="flex-1 max-w-7xl mx-auto w-full px-6 py-8 space-y-6">

    <!-- 시즌 타이틀 -->
    <div class="flex justify-center items-center gap-5 mb-2">
        <div class="bg-white border border-slate-300 rounded-xl px-4 py-2 text-sm font-bold shadow-sm">정규시즌</div>
        <div class="text-5xl font-black text-slate-800">2026</div>
    </div>

    <!-- 주간 날짜 슬라이더 -->
    <div class="bg-white border border-slate-300 rounded-3xl p-5 shadow-md">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3.5 mb-3 text-sm">
            <button id="btn-prev-week" class="text-slate-400 hover:text-slate-800 font-extrabold px-3 py-1">&lt; 이전 주</button>
            <div class="flex items-center gap-2">
                <span id="week-label" class="font-black text-blue-600 text-base"></span>
                <button id="btn-today" class="text-xs font-black px-2.5 py-1 rounded-xl bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100">오늘</button>
            </div>
            <button id="btn-next-week" class="text-slate-400 hover:text-slate-800 font-extrabold px-3 py-1">다음 주 &gt;</button>
        </div>
        <div id="week-days" class="grid grid-cols-7 gap-2 text-center text-xs md:text-sm font-bold"></div>
    </div>

    <!-- 경기 목록 -->
    <div class="bg-white border border-slate-300 rounded-3xl p-6 shadow-md">
        <div class="flex items-center justify-between border-b border-slate-100 pb-3 mb-5">
            <span class="text-xs font-black text-blue-600">⚽ K리그 프로축구 경기 일정</span>
            <span id="match-date-label" class="bg-blue-50 text-blue-600 px-3 py-1 rounded-xl text-xs font-bold"></span>
        </div>
        <div id="match-list" class="space-y-3">
            <div class="text-center text-slate-400 py-8">불러오는 중...</div>
        </div>
    </div>

</main>
<script src="/gnb.js"></script>
<script src="/notification.js"></script>
<script>
    const BASE_URL = window.location.origin;
    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

    let currentDate = new Date();
    let selectedDate = new Date();

    function goSoccerLive(matchId) {
        if (!matchId) return;
        location.href = `/soccer/live-match?matchId=${encodeURIComponent(matchId)}`;
    }

    function toDateStr(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}${m}${d}`;
    }

    function toDisplayDate(date) {
        return `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')}`;
    }

    function isSameDay(a, b) {
        return a.getFullYear() === b.getFullYear() &&
            a.getMonth() === b.getMonth() &&
            a.getDate() === b.getDate();
    }

    function renderWeek() {
        const rangeStart = new Date(currentDate);
        rangeStart.setDate(currentDate.getDate() - 3);

        const year = selectedDate.getFullYear();
        const month = selectedDate.getMonth() + 1;
        document.getElementById('week-label').textContent = `${year}년 ${month}월 K리그`;

        const container = document.getElementById('week-days');
        container.innerHTML = '';

        for (let i = 0; i < 7; i++) {
            const d = new Date(rangeStart);
            d.setDate(rangeStart.getDate() + i);

            const isToday = isSameDay(d, new Date());
            const isSelected = isSameDay(d, selectedDate);

            const div = document.createElement('div');

            if (isSelected) {
                div.className = 'p-2.5 bg-blue-600 rounded-2xl text-white shadow-md cursor-pointer';
                div.innerHTML = `<div class="font-black mb-1 text-[0.6875rem]">${isToday ? '오늘' : DAY_NAMES[d.getDay()]}</div><div class="font-black text-base">${d.getDate()}</div>`;
            } else if (isToday) {
                div.className = 'p-2.5 bg-blue-50 border border-blue-300 rounded-2xl cursor-pointer';
                div.innerHTML = `<div class="text-blue-600 font-black mb-1 text-[0.6875rem]">오늘</div><div class="text-blue-600 font-black">${d.getDate()}</div>`;
            } else {
                div.className = 'p-2.5 rounded-xl hover:bg-slate-50 cursor-pointer';
                div.innerHTML = `<div class="text-slate-400 mb-1 text-[0.6875rem]">${DAY_NAMES[d.getDay()]}</div><div class="text-slate-800 font-extrabold">${d.getDate()}</div>`;
            }

            const captured = new Date(d);
            div.addEventListener('click', () => {
                selectedDate = captured;
                currentDate = new Date(captured);
                renderWeek();
                loadMatches();
            });

            container.appendChild(div);
        }
    }

    document.getElementById('btn-prev-week').addEventListener('click', () => {
        currentDate.setDate(currentDate.getDate() - 7);
        renderWeek();
    });

    document.getElementById('btn-next-week').addEventListener('click', () => {
        currentDate.setDate(currentDate.getDate() + 7);
        renderWeek();
    });

    document.getElementById('btn-today').addEventListener('click', () => {
        selectedDate = new Date();
        currentDate = new Date();
        renderWeek();
        loadMatches();
    });

    function renderStatus(match) {
        if (match.status === 'finished') {
            return `<div class="w-1/3 text-center font-black text-slate-700 text-sm">
                <span class="text-xl font-black">${match.awayScore}</span>
                <span class="text-slate-400 mx-1">:</span>
                <span class="text-xl font-black">${match.homeScore}</span>
                <div class="text-[0.625rem] text-slate-400 mt-0.5">종료</div>
            </div>`;
        }

        if (match.status === 'in_progress') {
            return `<div class="w-1/3 text-center">
                <div class="text-emerald-600 font-black animate-pulse text-xs">LIVE</div>
                <div class="font-black text-sm mt-0.5">${match.awayScore} : ${match.homeScore}</div>
            </div>`;
        }

        if (match.status === 'cancelled') {
            return `<div class="w-1/3 text-center">
                <span class="text-red-600 px-3 py-1 rounded-xl text-xs font-black bg-red-50 border border-red-200">취소</span>
            </div>`;
        }

        return `<div class="w-1/3 text-center font-black text-slate-500 text-sm">${match.scheduledAt}</div>`;
    }

    function renderActionBtn(match) {
        if (match.status === 'in_progress') {
            return `
                <button onclick="event.stopPropagation(); goSoccerLive(${match.matchId})"
                        class="bg-red-500 text-white text-xs font-black px-4 py-1.5 rounded-xl animate-pulse">
                    라이브
                </button>`;
        }

        if (match.status === 'finished') {
            return `
                <button onclick="event.stopPropagation(); goSoccerLive(${match.matchId})"
                        class="bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold px-4 py-1.5 rounded-xl">
                    기록
                </button>`;
        }

        if (match.status === 'cancelled') {
            return `
                <button onclick="event.stopPropagation();"
                        class="bg-slate-100 text-slate-400 text-xs font-bold px-4 py-1.5 rounded-xl cursor-not-allowed"
                        disabled>
                    취소됨
                </button>`;
        }

        return `<div class="flex gap-1.5">
            <button onclick="event.stopPropagation(); goSoccerLive(${match.matchId})"
                    class="bg-slate-100 text-slate-700 text-xs font-black px-3 py-1.5 rounded-xl hover:bg-slate-200 transition-all">
                전력
            </button>
            <button onclick="event.stopPropagation(); toggleAiPrediction(${match.matchId}, '${match.awayTeamName}', '${match.homeTeamName}')"
                    id="ai-btn-${match.matchId}"
                    class="bg-gradient-to-r from-indigo-500 to-blue-500 text-white text-xs font-black px-3 py-1.5 rounded-xl hover:from-indigo-600 hover:to-blue-600 transition-all shadow-sm">
                AI 예측
            </button>
        </div>`;
    }

    function resultLabel(result, m) {
        if (result === 'HOME_WIN') return `${m.homeTeamName} 승`;
        if (result === 'AWAY_WIN') return `${m.awayTeamName} 승`;
        return '무승부';
    }

    function predBtnClass(selected) {
        return selected
            ? 'flex-1 py-2 rounded-xl text-xs font-black bg-blue-600 text-white shadow-sm transition-all'
            : 'flex-1 py-2 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 hover:bg-blue-50 hover:text-blue-600 transition-all';
    }

    function renderPrediction(m, pred) {
        const el = document.getElementById(`pred-${m.matchId}`);
        if (!el) return;

        if (m.status === 'scheduled') {
            const cur = pred ? pred.predictedResult : null;
            el.innerHTML = `
                <div class="px-4 pb-3 pt-2" onclick="event.stopPropagation();">
                    <div class="flex items-center gap-1.5">
                        <span class="text-[0.625rem] text-slate-400 font-bold mr-1">승부예측</span>
                        <button onclick="event.stopPropagation(); submitPrediction(${m.matchId}, 'AWAY_WIN', '${m.awayTeamName}', '${m.homeTeamName}')"
                                class="${predBtnClass(cur === 'AWAY_WIN')}">
                            ${m.awayTeamName} 승
                        </button>
                        <button onclick="event.stopPropagation(); submitPrediction(${m.matchId}, 'DRAW', '${m.awayTeamName}', '${m.homeTeamName}')"
                                class="${predBtnClass(cur === 'DRAW')}">
                            무승부
                        </button>
                        <button onclick="event.stopPropagation(); submitPrediction(${m.matchId}, 'HOME_WIN', '${m.awayTeamName}', '${m.homeTeamName}')"
                                class="${predBtnClass(cur === 'HOME_WIN')}">
                            ${m.homeTeamName} 승
                        </button>
                    </div>
                    ${cur ? `<p class="text-[0.625rem] text-slate-400 text-center mt-1">경기 시작 전까지 변경 가능</p>` : ''}
                </div>`;
            return;
        }

        if (m.status === 'cancelled') {
            el.innerHTML = pred ? `
                <div class="flex items-center justify-center gap-2 px-4 pb-3 pt-2" onclick="event.stopPropagation();">
                    <span class="text-[0.625rem] text-slate-400 font-bold">내 예측</span>
                    <span class="text-xs font-bold px-3 py-1 rounded-xl bg-blue-50 text-blue-600 border border-blue-200">
                        ${resultLabel(pred.predictedResult, m)}
                    </span>
                    <span class="text-xs font-bold px-3 py-1 rounded-xl bg-slate-100 text-slate-500 border border-slate-200">경기 취소</span>
                </div>` : `
                <div class="text-center px-4 pb-3 pt-2 text-xs text-slate-400 font-bold" onclick="event.stopPropagation();">
                    경기가 취소되었습니다.
                </div>`;
            return;
        }

        if (pred && m.status === 'finished') {
            let resultBadge;

            if (pred.isCorrect === null || pred.isCorrect === undefined) {
                resultBadge = `<span class="text-xs font-bold px-3 py-1 rounded-xl bg-amber-50 text-amber-600 border border-amber-200">집계 중...</span>`;
            } else if (pred.isCorrect) {
                resultBadge = `<span class="text-xs font-bold px-3 py-1 rounded-xl bg-green-50 text-green-700 border border-green-200">맞음 +100P</span>`;
            } else {
                resultBadge = `<span class="text-xs font-bold px-3 py-1 rounded-xl bg-red-50 text-red-500 border border-red-200">✗ 틀림</span>`;
            }

            el.innerHTML = `
                <div class="flex items-center justify-center gap-2 px-4 pb-3 pt-2" onclick="event.stopPropagation();">
                    <span class="text-[0.625rem] text-slate-400 font-bold">내 예측</span>
                    <span class="text-xs font-bold px-3 py-1 rounded-xl bg-blue-50 text-blue-600 border border-blue-200">
                        ${resultLabel(pred.predictedResult, m)}
                    </span>
                    ${resultBadge}
                    <span id="ai-result-${m.matchId}"></span>
                </div>`;
            loadAiResultBadge(m);
            return;
        }

        if (pred) {
            el.innerHTML = `
                <div class="flex items-center justify-center gap-2 px-4 pb-3 pt-2" onclick="event.stopPropagation();">
                    <span class="text-[0.625rem] text-slate-400 font-bold">내 예측</span>
                    <span class="text-xs font-bold px-3 py-1 rounded-xl bg-blue-50 text-blue-600 border border-blue-200">
                        ${resultLabel(pred.predictedResult, m)}
                    </span>
                </div>`;
        }
    }

    async function loadAiResultBadge(m) {
        const span = document.getElementById(`ai-result-${m.matchId}`);
        if (!span) return;

        try {
            let data = aiPredCache[m.matchId];

            if (!data) {
                const res = await fetch(`${BASE_URL}/api/ai-prediction/${m.matchId}`);
                if (!res.ok) return;
                data = await res.json();
                aiPredCache[m.matchId] = data;
            }

            const ap = data.awayWinProb ?? 0;
            const hp = data.homeWinProb ?? 0;
            const dp = data.drawProb ?? 0;

            let aiPred;
            if (dp > ap && dp > hp) aiPred = 'DRAW';
            else aiPred = hp >= ap ? 'HOME_WIN' : 'AWAY_WIN';

            const as = m.awayScore;
            const hs = m.homeScore;
            if (as == null || hs == null) return;

            let actual;
            if (as > hs) actual = 'AWAY_WIN';
            else if (hs > as) actual = 'HOME_WIN';
            else actual = 'DRAW';

            span.innerHTML = aiPred === actual
                ? `<span class="text-xs font-bold px-3 py-1 rounded-xl bg-violet-50 text-violet-600 border border-violet-200">AI 적중 ✓</span>`
                : `<span class="text-xs font-bold px-3 py-1 rounded-xl bg-slate-100 text-slate-500 border border-slate-200">AI 빗나감</span>`;
        } catch (e) {}
    }

    async function submitPrediction(matchId, result, awayName, homeName) {
        if (!localStorage.getItem('accessToken')) {
            if (confirm('로그인 후 이용 가능합니다.\n로그인 페이지로 이동하시겠습니까?')) location.href = '/login';
            return;
        }

        try {
            const res = await authFetch(`${BASE_URL}/api/predictions`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ matchId, sportCode: 'soccer', predictedResult: result })
            });

            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                alert(err.message || '예측 제출에 실패했습니다.');
                return;
            }

            const pred = await res.json();
            const fakeMatch = { matchId, homeTeamName: homeName, awayTeamName: awayName, status: 'scheduled' };
            renderPrediction(fakeMatch, pred);
        } catch (e) {
            alert('예측 제출 중 오류가 발생했습니다.');
        }
    }

    async function loadMatches() {
        const dateStr = toDateStr(selectedDate);

        document.getElementById('match-date-label').textContent =
            `${toDisplayDate(selectedDate)} ${DAY_NAMES[selectedDate.getDay()]}요일`;

        const container = document.getElementById('match-list');
        container.innerHTML = '<div class="text-center text-slate-400 py-8">불러오는 중...</div>';

        try {
            const res = await authFetch(`${BASE_URL}/api/schedule/soccer?date=${dateStr}`);
            const matches = await res.json();

            if (!matches.length) {
                container.innerHTML = '<div class="text-center text-slate-400 py-8 font-bold">경기가 없습니다.</div>';
                return;
            }

            container.innerHTML = matches.map(m => `
                <div onclick="goSoccerLive(${m.matchId})"
                     role="button"
                     tabindex="0"
                     onkeydown="if(event.key === 'Enter') goSoccerLive(${m.matchId})"
                     class="bg-slate-50 rounded-2xl border border-slate-200 hover:border-blue-300 hover:shadow-md transition-all cursor-pointer">
                    <div class="flex items-center justify-between p-4">
                        <div class="w-20 flex items-center gap-2">
                            <span class="font-black text-slate-500 text-sm">${m.scheduledAt}</span>
                        </div>
                        <div class="flex-grow flex justify-around items-center px-4 text-slate-700 text-sm">
                            <div class="w-1/3 flex items-center justify-end gap-1.5">
                                <span class="font-bold text-slate-800">${m.awayTeamName}</span>
                                ${m.awayTeamEmblem ? `<img src="${m.awayTeamEmblem}" class="w-6 h-6 object-contain shrink-0" onerror="this.style.display='none'" alt="${m.awayTeamName}">` : '<div class="w-6 h-6 shrink-0"></div>'}
                            </div>
                            ${renderStatus(m)}
                            <div class="w-1/3 flex items-center gap-1.5">
                                ${m.homeTeamEmblem ? `<img src="${m.homeTeamEmblem}" class="w-6 h-6 object-contain shrink-0" onerror="this.style.display='none'" alt="${m.homeTeamName}">` : '<div class="w-6 h-6 shrink-0"></div>'}
                                <span class="font-bold text-slate-800">${m.homeTeamName}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 ml-2">
                            <span class="text-slate-400 text-xs">${m.venue ?? ''}</span>
                            ${renderActionBtn(m)}
                        </div>
                    </div>
                    <div class="border-t border-slate-100" id="pred-${m.matchId}"></div>
                    <div id="ai-pred-${m.matchId}" class="hidden"></div>
                </div>
            `).join('');

            if (localStorage.getItem('accessToken')) {
                loadPredictions(matches);
            } else {
                matches.filter(m => m.status === 'scheduled').forEach(m => {
                    const el = document.getElementById(`pred-${m.matchId}`);
                    if (el) {
                        el.innerHTML = `
                            <div class="px-4 pb-2 pt-1.5 text-center" onclick="event.stopPropagation();">
                                <a href="/login"
                                   onclick="event.stopPropagation();"
                                   class="text-[0.6875rem] text-slate-400 hover:text-blue-500 transition-colors font-bold">
                                    로그인하면 승부예측에 참여할 수 있어요
                                </a>
                            </div>`;
                    }
                });
            }
        } catch (e) {
            container.innerHTML = '<div class="text-center text-red-400 py-8">데이터를 불러올 수 없습니다.</div>';
        }
    }

    async function loadPredictions(matches) {
        try {
            for (const m of matches) {
                const r = await authFetch(`${BASE_URL}/api/predictions/match/${m.matchId}`);

                if (r.status === 204) {
                    renderPrediction(m, null);
                    continue;
                }

                if (r.ok) {
                    const pred = await r.json();
                    renderPrediction(m, pred);
                }
            }
        } catch (e) {}
    }

    const aiPredCache = {};

    async function toggleAiPrediction(matchId, awayName, homeName) {
        const panel = document.getElementById(`ai-pred-${matchId}`);
        if (!panel) return;

        if (!panel.classList.contains('hidden')) {
            panel.classList.add('hidden');
            const btn = document.getElementById(`ai-btn-${matchId}`);
            if (btn) btn.textContent = 'AI 예측';
            return;
        }

        if (aiPredCache[matchId]) {
            renderAiPrediction(matchId, aiPredCache[matchId], awayName, homeName);
            const cachedBtn = document.getElementById(`ai-btn-${matchId}`);
            if (cachedBtn) cachedBtn.textContent = 'AI 예측 닫기';
            return;
        }

        panel.classList.remove('hidden');
        panel.innerHTML = `<div class="border-t border-slate-100 px-4 py-4 text-center text-slate-400 text-xs font-bold">AI 분석 중...</div>`;

        const btn = document.getElementById(`ai-btn-${matchId}`);
        if (btn) btn.textContent = '⏳ 분석 중...';

        try {
            const res = await fetch(`${BASE_URL}/api/ai-prediction/soccer/${matchId}`);
            if (!res.ok) throw new Error();

            const data = await res.json();
            aiPredCache[matchId] = data;
            renderAiPrediction(matchId, data, awayName, homeName);

            if (btn) btn.textContent = 'AI 예측 닫기';
        } catch (e) {
            panel.innerHTML = `<div class="border-t border-slate-100 px-4 py-3 text-center text-red-400 text-xs font-bold">AI 예측을 불러올 수 없습니다.</div>`;
            if (btn) btn.textContent = 'AI 예측';
        }
    }

    function renderAiPrediction(matchId, data, awayName, homeName) {
        const panel = document.getElementById(`ai-pred-${matchId}`);
        if (!panel) return;

        panel.classList.remove('hidden');

        const homeProb = data.homeWinProb.toFixed(1);
        const awayProb = data.awayWinProb.toFixed(1);
        const drawProb = data.drawProb.toFixed(1);

        const homeHigher = parseFloat(homeProb) >= parseFloat(awayProb);
        const awayHigher = parseFloat(awayProb) > parseFloat(homeProb);

        const totalWith = parseFloat(homeProb) + parseFloat(drawProb) + parseFloat(awayProb);
        const awayW = (parseFloat(awayProb) / totalWith * 100).toFixed(1);
        const drawW = (parseFloat(drawProb) / totalWith * 100).toFixed(1);
        const homeW = (parseFloat(homeProb) / totalWith * 100).toFixed(1);

        const drawBar = parseFloat(drawProb) > 0
            ? `<div class="flex flex-col items-center justify-center transition-all duration-500"
                     style="width:${drawW}%; background:#e2e8f0; font-size:10px; font-weight:700; color:#64748b;">
                   <span>무</span><span>${drawProb}%</span>
               </div>` : '';

        const keyFactorsHtml = data.keyFactors && data.keyFactors.length
            ? `<div class="flex flex-wrap gap-1 mt-2">
                ${data.keyFactors.map(f =>
                `<span class="text-[0.625rem] font-bold px-2 py-0.5 rounded-lg bg-indigo-50 text-indigo-600 border border-indigo-100">${f}</span>`
            ).join('')}
               </div>` : '';

        const reasoningHtml = data.reasoning
            ? `<div class="text-xs text-slate-600 leading-relaxed mt-2 bg-white rounded-xl p-3 border border-slate-100">${data.reasoning}</div>` : '';

        panel.innerHTML = `
            <div class="border-t border-slate-100 px-4 py-3 bg-gradient-to-b from-slate-50 to-white rounded-b-2xl" onclick="event.stopPropagation();">
                <div class="flex items-center gap-1 mb-2">
                    <span class="text-[0.625rem] font-black text-indigo-500">AI 승부 예측</span>
                    <span class="text-[0.625rem] text-slate-400 font-bold ml-auto">GPT-4o-mini</span>
                </div>
                <div class="flex rounded-xl overflow-hidden h-8 text-xs font-black">
                    <div class="flex items-center justify-start pl-3 transition-all duration-500"
                         style="width:${awayW}%;
                                background:${awayHigher ? 'linear-gradient(90deg,#e11d48,#f43f5e)' : 'linear-gradient(90deg,#94a3b8,#cbd5e1)'};
                                color:${awayHigher ? '#fff' : '#475569'};">
                        ${awayProb}%
                    </div>
                    ${drawBar}
                    <div class="flex items-center justify-end pr-3 transition-all duration-500"
                         style="width:${homeW}%;
                                background:${homeHigher ? 'linear-gradient(90deg,#f43f5e,#e11d48)' : 'linear-gradient(90deg,#cbd5e1,#94a3b8)'};
                                color:${homeHigher ? '#fff' : '#475569'};">
                        ${homeProb}%
                    </div>
                </div>
                <div class="flex justify-between items-center mt-1.5 mb-1">
                    <div class="flex items-center gap-1">
                        ${awayHigher ? `<span class="text-[0.625rem] font-black px-2 py-0.5 rounded-lg bg-rose-100 text-rose-600">예측 우세</span>` : ''}
                        <span class="text-xs font-bold text-slate-700">${awayName}</span>
                    </div>
                    <span></span>
                    <div class="flex items-center gap-1">
                        <span class="text-xs font-bold text-slate-700">${homeName}</span>
                        ${homeHigher ? `<span class="text-[0.625rem] font-black px-2 py-0.5 rounded-lg bg-rose-100 text-rose-600">예측 우세</span>` : ''}
                    </div>
                </div>
                ${reasoningHtml}
                ${keyFactorsHtml}
            </div>`;
    }

    renderWeek();
    loadMatches();
</script>
</body>
</html>
