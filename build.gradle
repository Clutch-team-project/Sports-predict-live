plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example.edu'
version = '0.0.1-SNAPSHOT'
description = 'Sports_predict_live'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {

    //  Spring Boot Starters 
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'       // LOL lolesports API WebClient
    implementation 'org.springframework.boot:spring-boot-starter-websocket'     // 경기 중계 실시간
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    //  JWT 
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly  'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly  'io.jsonwebtoken:jjwt-jackson:0.12.3'

    //  QueryDSL 
    implementation         'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor    'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor    'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor    'jakarta.persistence:jakarta.persistence-api'

    //  기타 라이브러리 
    implementation 'org.modelmapper:modelmapper:3.1.1'

    //  Lombok 
    compileOnly         'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly         'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    //  DB 
    runtimeOnly 'com.mysql:mysql-connector-j'

    //  개발 도구 
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    //  테스트 
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}