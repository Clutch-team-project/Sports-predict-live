plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.14'
    id 'io.spring.dependency-management' version '1.1.7'
}

group       = 'com.example.edu'
version     = '0.0.1-SNAPSHOT'
description = 'Sports_predict_live'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // ==========================================
    // 1. Spring Boot Core & Web
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'   // 외부 API(LoL e스포츠 등) 비동기 통신
    implementation 'org.springframework.boot:spring-boot-starter-websocket' // 경기 중계 실시간 소켓 통신
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // ==========================================
    // 2. Database & ORM
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly    'com.mysql:mysql-connector-j'

    // QueryDSL
    implementation      'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // ==========================================
    // 3. Security & Authentication
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'

    // JWT Token
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // ==========================================
    // 4. Utilities & External Services
    // ==========================================
    implementation 'org.springframework.boot:spring-boot-starter-mail' // 메일 발송
    implementation 'org.modelmapper:modelmapper:3.1.1'                 // DTO 변환
    implementation 'org.jsoup:jsoup:1.17.2'                            // 크롤링 (뉴스 이미지 등)

    // ==========================================
    // 5. Developer Tools
    // ==========================================
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Lombok
    compileOnly             'org.projectlombok:lombok'
    annotationProcessor     'org.projectlombok:lombok'
    testCompileOnly         'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // ==========================================
    // 6. Testing
    // ==========================================
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}